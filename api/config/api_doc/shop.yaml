openapi: 3.1.0
info:
  title: NODRA Commerce API
  version: 0.6.1
  description: >-
    JSON contract for the NODRA cycling equipment storefront and administration.
    Every error under /api/ is JSON whatever the Accept header says, see Problem. A request body or query string
    that fails validation is a 422 with `violations`; a body that isn't valid JSON is a 400 and a missing or
    unsupported Content-Type a 415, both with a Problem body. Errors raised by business rules carry a machine-readable
    `code` (see Problem).
    Money is always an integer in minor units (haléře for CZK, cents for EUR). Orders are always in CZK whatever the
    interface language; EUR is a display reference in the catalogue only (older EUR demo orders keep their currency).
    Percentages are basis points (100 = 1 %), exchange rates integer millionths (25.315 CZK per EUR = 25315000). Cost,
    supplier, seller, offer id or URL, supplier order reference, purchases, exchange rate, markup, margin, order
    economics, RRP, market price and journal actors are admin-only and never appear in public responses. Feed imports
    are admin-only too: source files, supplier SKUs, import runs and field origins stay out of every public response.
    Dates without a time (promisedDate, fxRateDate) are Prague calendar dates, YYYY-MM-DD.
servers:
  - url: http://localhost:8000
tags:
  - name: Catalogue
  - name: Checkout
  - name: Account
  - name: Administration
paths:
  /api/account/google/start:
    get:
      tags: [Account]
      summary: Start Google OpenID Connect sign-in
      description: Redirects to Google when OAuth credentials are configured. Uses the server session to verify state on return.
      parameters: [{ name: locale, in: query, schema: { type: string, enum: [cs, de, en] } }]
      responses:
        '302': { description: Redirect to Google or to the local account page when credentials are absent. }
  /api/account/google/callback:
    get:
      tags: [Account]
      summary: Complete Google sign-in
      description: Verifies OAuth state and Google verified email, then creates or resumes the account.
      responses:
        '302': { description: Redirect to the account page. }
  /api/account/demo-login:
    post:
      tags: [Account]
      summary: Sign in to a local demo account
      description: Available only in the development environment; first sign-in sends a welcome email to local Mailpit.
      responses:
        '200': { description: Demo account summary. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/account/me:
    get:
      tags: [Account]
      summary: Read signed-in account and earned points
      description: >-
        Returns the full point balance and up to 20 ledger entries for the requested history page. Points are earned
        when an order is completed and lowered by refunds after that (entries with reason `refund` have negative points).
        `lastDelivery` holds the contact and address of the account's latest order, for prefilling checkout, or null.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: 'Account profile, point balance, history page, history totals and last delivery details.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountSummary' } } }
        '401': { description: Sign-in required. }
        '422': { $ref: '#/components/responses/Validation' }
  /api/account/logout:
    post:
      tags: [Account]
      summary: Clear customer session
      responses:
        '200': { description: Session ended. }
  /api/products:
    get:
      tags: [Catalogue]
      summary: Browse published cycling products
      description: Returns public product cards in a stable order. Filters can be combined; the response contains only fields needed by the product list. A category filter includes products from its subcategories. Attribute filters match when at least one active variant has the value, a variant value taking precedence over the product value. Search matches the localized name, brand, slug, variant MPN and exact EAN. Each card carries the best availability among its active variants. Successful responses may be cached by shared caches for 15 seconds; checkout always checks current stock, availability and prices.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: category, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string, maxLength: 80 } }
        - name: attr
          in: query
          style: deepObject
          explode: true
          description: 'Attribute filters, for example attr[speeds]=11,12. Several comma-separated values mean any of them; several keys must all match.'
          schema: { type: object, additionalProperties: { type: string, maxLength: 200 } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: sort, in: query, schema: { type: string, enum: [featured, price_asc, price_desc, newest] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: availableOnly, in: query, description: 'Only products with at least one `orderable` variant (own stock, or a fresh matched offer with known lead time).', schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Paginated published products.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pages, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
                  page: { type: integer }
                  pages: { type: integer }
                  total: { type: integer }
        '422': { $ref: '#/components/responses/Validation' }
  /api/products/{slug}:
    get:
      tags: [Catalogue]
      summary: Read one published product
      description: Returns localized copy, product imagery, options, prices and availability with lead time for one product and each of its active variants.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Product details.
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/categories:
    get:
      tags: [Catalogue]
      summary: List catalogue categories
      description: Returns the active category tree with localized labels. Each count includes published products of its active subcategories.
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses:
        '200':
          description: Root categories with nested children.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /api/categories/{slug}/facets:
    get:
      tags: [Catalogue]
      summary: List filter values for one category
      description: Returns brands and filterable attribute values found among published products of the category and its subcategories, with product counts. Counts ignore other active filters.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Available filter values.
          content: { application/json: { schema: { $ref: '#/components/schemas/Facets' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/checkout/quote:
    post:
      tags: [Checkout]
      summary: Price a basket for one delivery method
      description: >-
        No side effects. Reprices the basket in CZK, tells the availability and lead time of every line, which delivery
        methods are offered for the postal code, and the two ways to deliver: `together` (one shipment, lead time of the
        slowest line) and `split` (one shipment per group of lines with the same maximum lead time; lines whose date is
        still to be confirmed form one group), or null when there is only one group. A line covered by NODRA's own stock
        is `orderable` with the handling days as lead time. Fees are computed here only: Prague personal delivery is
        free from 500 Kč of goods (`freeFromMinor` on the method) and 149 Kč per shipment below that, pickup at Anděl
        is free, carrier delivery is not offered until its tariff is set. The pickup note is in the request `locale`.
        `options` is null while the method isn't available for the postal code or a line is `unavailable`;
        `canCheckout` says whether POST /api/checkout would accept this basket and method. Asking for a method that
        isn't offered at all is a 422 `method_unavailable` with `reason` `not_offered`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuoteRequest' } } }
      responses:
        '200':
          description: Quote.
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutQuote' } } }
        '422': { $ref: '#/components/responses/Validation' }
  /api/checkout:
    post:
      tags: [Checkout]
      summary: Send an order request as a guest or signed-in customer
      description: >-
        Recomputes the quote in a transaction and creates an order with status `requested`: NODRA checks the offer and
        agrees price and date with the customer before confirming. The order is always in CZK. Lines covered by own stock
        reserve it (`from_stock`); every other line is ordered from a supplier after confirmation and reserves nothing.
        A line whose availability is `unavailable` is refused (422, code `unavailable`, with `variantId`); `check_needed`
        is accepted and confirmed by hand. The client sends no amounts except `expectedTotal`, the total of the quote the
        customer saw for the chosen fulfilment: if the recomputed total differs, nothing is written and the answer is a
        409 with code `quote_changed` and the fresh quote. A method that isn't available for the postal code (code
        `method_unavailable`) or `split` with fewer than two groups (code `split_unavailable`) is a 422. Signed-in
        customers must use their account email to earn points on completion. Repeating the same Idempotency-Key and
        payload returns the same order (201 again); the same key with a different payload is a 409 with code
        `idempotency_conflict`. Nothing is paid here: payment happens on receipt.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 80 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutRequest' } } }
      responses:
        '201':
          description: Order request created, or the one created earlier with the same key and payload.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderReceipt' } } }
        '409':
          description: '`quote_changed` (with `quote`, the fresh CheckoutQuote) or `idempotency_conflict`.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      quote: { $ref: '#/components/schemas/CheckoutQuote' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/orders/{reference}:
    get:
      tags: [Checkout]
      summary: Look up an order
      description: >-
        Requires the unguessable lookup token returned at checkout; never exposes customer information to a reference
        alone. Shows the order and payment status, the shipments with their fee, lead time and agreed window, and the
        lead time of every line, the contact channel the customer chose and the pickup note in the order language.
        Never shows cost, supplier, offer, purchase or procurement details.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Customer-facing order receipt.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderReceipt' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/login:
    post:
      tags: [Administration]
      summary: Start an admin session
      description: Authenticates a seeded demo administrator and starts an HTTP-only session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Signed in. }
        '401':
          description: 'Wrong email or password: a Problem with code `invalid_credentials`, the same message for both.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
  /api/admin/me:
    get:
      tags: [Administration]
      summary: Read the active admin session
      description: Returns the admin identity and CSRF token for authenticated requests.
      responses:
        '200': { description: Authenticated administrator. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/logout:
    post:
      tags: [Administration]
      summary: End the admin session
      responses:
        '302': { description: Session ended. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/dashboard:
    get:
      tags: [Administration]
      summary: Read operational dashboard
      description: 'Returns order counts (open = requested or confirmed), the work queue counts, recent orders, variants NODRA holds itself (own stock above zero, lowest first) and revenue totals: revenueCzkMinor over CZK orders that are not cancelled, revenueEurMinor over the older EUR demo orders.'
      responses:
        '200':
          description: Admin dashboard data.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminDashboard' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/queues:
    get:
      tags: [Administration]
      summary: Count orders in each work queue
      description: >-
        One aggregate over all orders; an order can be in several queues. review - status requested; problem - an
        active line is failed; to_purchase - confirmed with an active to_order line; waiting - an active line is
        ordered; delayed - an active ordered line is past its promised date (the Prague day the order was last
        confirmed + the line's leadTimeMaxDays; late from the next day, never without a lead time); to_schedule -
        confirmed with a planned shipment whose active lines all have their goods; delivering - a shipment is
        scheduled; unpaid - a shipment was handed over and amountDue > 0; refund - refundDue > 0. Each is also a
        `queue=` filter of GET /api/admin/orders.
      responses:
        '200':
          description: Orders per queue.
          content: { application/json: { schema: { $ref: '#/components/schemas/QueueCounts' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/settings:
    get:
      tags: [Administration]
      summary: Read the order settings
      description: Accepted payment and refund methods, delivery methods and fees, the pickup note per language and the privacy text version. Read-only, they are set in the API configuration.
      responses:
        '200':
          description: Settings.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminSettings' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/products:
    get:
      tags: [Administration]
      summary: List products for editing
      description: Returns up to 24 products per page, including drafts, category, brand, attributes, variant identifiers, dated supplier offers and separate NODRA inventory data. Reported supplier quantity is not owned stock. Search also matches brand, variant MPN and EAN.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: Admin product page.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminProductPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
    post:
      tags: [Administration]
      summary: Create a product
      description: Creates a product with one zero-stock variant; the submitted status may be draft or published. The category must be active and not hidden by an inactive parent. The variant's first price starts its price history (reason `manual`). Requires X-CSRF-Token from /api/admin/me.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductWriteRequest' } } }
      responses:
        '201': { description: Product created. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/products/{id}:
    put:
      tags: [Administration]
      summary: Update a product
      description: >-
        Changes localized copy, category, brand, attributes, status, image, merchandising order and the first variant's base prices
        (a changed price goes to the price history with reason `manual`). Long descriptions, details and gallery images are kept. A draft may stay in its category after that category was deactivated
        or hidden by a parent, but it can't be published there. When the category changes, variant attribute overrides the new
        category doesn't define or allow are dropped and the rest are normalized again. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductWriteRequest' } } }
      responses:
        '200': { description: Product updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/stock-adjustments:
    post:
      tags: [Administration]
      summary: Adjust variant inventory
      description: Records a reasoned stock movement and updates availability atomically. Requires X-CSRF-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, delta, reason]
              properties:
                variantId: { type: string, format: uuid }
                delta: { type: integer, not: { const: 0 } }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201': { description: Stock movement recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/products/{id}/variants:
    post:
      tags: [Administration]
      summary: Add a variant with zero stock
      description: Requires an authenticated session and X-CSRF-Token. The SKU and EAN must be unused. The first price starts the variant's price history (reason `manual`).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VariantWriteRequest' } } }
      responses:
        '201': { description: Variant created. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/variants/{id}:
    put:
      tags: [Administration]
      summary: Update a variant
      description: >-
        Updates labels, identifiers, attributes, prices, RRP, market price and active status. SKU is immutable. Like every
        PUT here it replaces the whole record, so RRP and market fields left out are cleared. A changed CZK or EUR price is
        written to the price history with reason `manual`. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VariantWriteRequest' } } }
      responses:
        '200': { description: Variant updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/categories:
    get:
      tags: [Administration]
      summary: List all categories
      description: Returns every category, including inactive ones, as a flat list ordered for tree display. Attribute definitions are the category's own; the effective set also includes its ancestors' definitions.
      responses:
        '200':
          description: Categories.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminCategory' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Administration]
      summary: Create a category
      description: Requires X-CSRF-Token. Attribute keys must be unique across the category and its ancestors.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWriteRequest' } } }
      responses:
        '201': { description: Category created. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/categories/{id}:
    put:
      tags: [Administration]
      summary: Update a category
      description: Changes labels, parent, position, active state and own attribute definitions. A category cannot move under itself or a descendant, and while its subtree holds published products it can be neither deactivated nor moved under an inactive or hidden parent. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWriteRequest' } } }
      responses:
        '200': { description: Category updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/products/{id}/supplier-offers:
    post:
      tags: [Administration]
      summary: Record a supplier offer
      description: Stores a dated supplier listing for the product. Status `matched` needs the exact variant; the variant must belong to the product. Supplier data never appears in public responses. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SupplierOfferWriteRequest' } } }
      responses:
        '201': { description: Offer recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/supplier-offers/{id}:
    put:
      tags: [Administration]
      summary: Update a supplier offer
      description: Updates the check result, inbound shipping, exchange rate, lead time, variant match and status. Existing orders keep their snapshot. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SupplierOfferWriteRequest' } } }
      responses:
        '200': { description: Offer updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders:
    get:
      tags: [Administration]
      summary: List orders for fulfilment
      description: >-
        Returns up to 30 orders per page, newest first, optionally only one order status, one payment status, one work
        queue (see GET /api/admin/queues) and/or a search. `q` matches part of the reference, customer name, email or
        a supplier order reference of a line (case-insensitive); a query of digits, spaces, +, -, ( ) with at least 3
        digits also matches the phone by its digits. Every row carries the queues it is in and the delayed flag.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: status, in: query, schema: { type: string, enum: [requested, confirmed, completed, cancelled] } }
        - { name: paymentStatus, in: query, schema: { type: string, enum: [unpaid, partially_paid, paid, partially_refunded, refunded] } }
        - { name: queue, in: query, schema: { $ref: '#/components/schemas/OrderQueue' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Admin order page.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrderPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}:
    get:
      tags: [Administration]
      summary: Read an order for fulfilment
      description: >-
        Customer and consents, lines with the exact variant, source offer, procurement status, supplier reference, the
        cost snapshot taken at checkout, the actual cost and reference of their purchase, promised date and delayed
        flag, shipments with the computed `ready` flag, the payment ledger with voids, the journal, the queues the order
        is in, its economics, and the actions and corrections allowed right now on the order, on each line, shipment
        and ledger entry. Every action and correction below answers with this same document.
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Order.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrder' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/orders/{id}/confirm:
    post:
      tags: [Administration]
      summary: Confirm a requested order
      description: >-
        The customer agreed price and date. Allowed while the order is `requested`, has an active line and no active line is `failed`. Writes the agreement channel and note to the journal. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmOrderRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/cancel:
    post:
      tags: [Administration]
      summary: Cancel the whole order
      description: >-
        Allowed while `requested` or `confirmed` and no shipment was handed over. Active lines become `cancelled`: reserved own stock goes back, goods already received become own stock (stock movements with the order reference); lines still `ordered` go to own stock when they are marked received. Open shipments are cancelled and their fees drop. Money already taken stays in the ledger and shows as `refundDue` until a refund is recorded. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/items/{itemId}/terms:
    post:
      tags: [Administration]
      summary: Change a line's price or lead time
      description: >-
        Allowed on an active line whose shipment is not handed over, while the order is `requested` or `confirmed`. A `confirmed` order goes back to `requested` until the customer agrees again (confirm). Send the new unit price, the new lead time (both min and max), or both. Shipment fees fixed at checkout never go up, even when the goods total falls below the free-delivery threshold. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LineTermsRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/items/{itemId}/ordered:
    post:
      tags: [Administration]
      summary: Mark a line ordered from the supplier
      description: >-
        Allowed on an active `to_order` line of a `confirmed` order. Stores the supplier order reference (admin-only). Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarkOrderedRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/items/{itemId}/received:
    post:
      tags: [Administration]
      summary: Mark a line's goods received
      description: >-
        Allowed on an `ordered` line. On an active line the goods wait for its shipment; on a cancelled line they become own stock (stock movement with the order reference). Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
  /api/admin/orders/{id}/items/{itemId}/failed:
    post:
      tags: [Administration]
      summary: Mark procurement of a line failed
      description: >-
        Allowed on an active `to_order` or `ordered` line. Then cancel the line or add a replacement; the order can not be confirmed while a failed line is active. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/items/{itemId}/cancel:
    post:
      tags: [Administration]
      summary: Cancel one line
      description: >-
        Allowed on an active line whose shipment is not handed over. Stock effects as for the whole order. A shipment left without active lines is cancelled with its fee; an order left without active lines is cancelled. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/items/{itemId}/replacement:
    post:
      tags: [Administration]
      summary: Replace a failed line with another variant
      description: >-
        Allowed on an active `failed` line whose shipment is not handed over. Requires `customerAgreedVia`: a model is never swapped without the customer. The failed line is cancelled and the new line joins the same shipment; it reserves own stock when that covers it, otherwise it is `to_order`. Price defaults to the variant CZK price, quantity to the failed line quantity, lead time to the current availability. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReplacementRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/items/{itemId}/return:
    post:
      tags: [Administration]
      summary: Take back a delivered line
      description: >-
        The 14-day withdrawal: allowed on an active line whose shipment was handed over. The line becomes `returned`, its goods go to own stock; record the refund separately. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/shipments/{shipmentId}/schedule:
    post:
      tags: [Administration]
      summary: Agree a delivery or pickup window
      description: >-
        Allowed on a `planned`, `scheduled` (reschedule) or `refused` (re-plan) shipment with active lines of a `confirmed` order. Re-planning a refused shipment takes its goods from own stock again (409 `not_enough_stock` when they are gone). Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ShipmentId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleShipmentRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/shipments/{shipmentId}/hand-over:
    post:
      tags: [Administration]
      summary: Hand a shipment over
      description: >-
        Allowed on a `scheduled` shipment that is ready (every active line `from_stock` or `received`) of a `confirmed` order. When every active line is delivered and the order is paid, the order completes and loyalty points are earned once. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
  /api/admin/orders/{id}/shipments/{shipmentId}/refused:
    post:
      tags: [Administration]
      summary: Record that the customer refused a shipment
      description: >-
        Allowed on a `scheduled`, ready shipment of a `confirmed` order. Its goods become own stock; then cancel the order or re-plan the shipment. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ShipmentId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/payments:
    post:
      tags: [Administration]
      summary: Record a payment or a refund
      description: >-
        Appends to the order's payment ledger; entries are never edited or deleted (a mistake is voided, see
        /payments/{paymentId}/void). A payment is accepted while the order is `requested` or `confirmed`, or
        `completed` when money is owed again after a voided payment (its points come back), with a handover method
        (`cash`, `bank_transfer`; `card` and `carrier_cod` only once enabled; see GET /api/admin/settings), and never
        above what is still due (422 `overpayment`). A refund is accepted in any status up to the net
        amount received (422 `refund_exceeds_paid`); on a completed order it lowers the customer's points for the refunded
        amount, never below zero for that order. The payment status is recomputed from the ledger on every write, and the
        order completes when every active line is delivered and it is paid. The same Idempotency-Key again returns the
        first entry (201) without a second write; the same key with a different body is a 409 `idempotency_conflict`.
        Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 80 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecordPaymentRequest' } } }
      responses:
        '201':
          description: Entry recorded, or the entry recorded earlier with this key.
          content:
            application/json:
              schema:
                type: object
                required: [payment, order]
                properties:
                  payment: { $ref: '#/components/schemas/AdminPayment' }
                  order: { $ref: '#/components/schemas/AdminOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/items/{itemId}/move:
    post:
      tags: [Administration]
      summary: Move a line to another shipment or a new part
      description: >-
        Correction. Allowed on an active line whose shipment is `planned` or `scheduled`, while the order is
        `requested` or `confirmed`. `shipmentId` is another `planned` or `scheduled` shipment of the order (409
        `shipment_closed` otherwise); null starts a new part with the same method and fee 0, since the owner split the
        order. Moving never raises a fee; a shipment left without active lines is cancelled with its fee. Needs a
        reason, written to the journal (`item_moved`) with the admin's email. Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MoveLineRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/items/{itemId}/undo-received:
    post:
      tags: [Administration]
      summary: Take back a mistaken "received"
      description: >-
        Correction. Allowed on an active `received` line whose shipment is `planned` or `scheduled` (not handed over,
        not refused), while the order is `requested` or `confirmed`. The line is `ordered` again; a purchase it came
        with keeps its status. Needs a reason (`item_receipt_undone` in the journal). Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/shipments/{shipmentId}/reschedule:
    post:
      tags: [Administration]
      summary: Move an agreed window
      description: >-
        Correction. Allowed on a `scheduled` shipment of a `confirmed` order. Needs a reason; the journal keeps the
        old and the new window (`shipment_rescheduled`). Requires X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ShipmentId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RescheduleShipmentRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders/{id}/payments/{paymentId}/void:
    post:
      tags: [Administration]
      summary: Void a payment or refund entry
      description: >-
        Correction, in any order status. The ledger stays append-only: a `correction` entry with the same amount and
        method points at the voided one (`correctsId`), and the voided entry gets `voidedById`. An entry is voided
        once (409 `action_not_allowed` the second time); a correction can't be voided. A payment can't be voided when
        that would leave less than nothing received (422 `void_exceeds_paid`, with `paidMinor`): void the refunds
        first. Payment status is recomputed. On a completed order the order stays `completed` (it shows in the
        `unpaid` queue when money is owed again and a payment can be recorded) and loyalty points follow the money:
        points of the amount lost since completion are taken back, never more than earned, and given back when money
        returns (loyalty entries with reason `correction`). Needs a reason (`entry_voided` in the journal). Requires
        X-CSRF-Token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/AdminOrderUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/to-purchase:
    get:
      tags: [Administration]
      summary: List what is left to buy, by supplier
      description: >-
        Active `to_order` lines of confirmed orders, grouped by the supplier of the offer snapshotted at checkout
        (suppliers by code, then one group with supplier null for lines without an offer). Each line has its order,
        variant, quantity, the offer as it is now (link, seller, price, currency, rate) and the unit cost snapshot.
      responses:
        '200':
          description: Lines to buy.
          content: { application/json: { schema: { $ref: '#/components/schemas/ToPurchase' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/purchases:
    get:
      tags: [Administration]
      summary: List purchases
      description: Up to 30 per page, newest first, optionally one status.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: status, in: query, schema: { type: string, enum: [ordered, received, cancelled] } }
      responses:
        '200':
          description: Purchase page.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminPurchasePage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
    post:
      tags: [Administration]
      summary: Record a purchase placed on a supplier's site
      description: >-
        A human places the order with the supplier; this records it for selected lines of one supplier. Every line
        must be an active `to_order` line of a `confirmed` order (409 `line_not_purchasable`, with `itemId`) whose
        checkout offer is from `supplier`; lines without an offer may join any supplier (422 `mixed_suppliers`, with
        `itemId`, otherwise). An unknown line is a 422 `invalid_field`. `fxRateCzk` is required for EUR and PLN and
        must be 1000000 or left out for CZK. Inbound shipping is split across the lines in proportion to unit price x
        quantity, rounded down, the remainder to the largest line; actual unit cost CZK = round((unit price + allocated
        shipping / quantity) x rate). The lines become `ordered` with `supplierReference` = `reference` (journal
        `item_ordered` with the purchase id). Repeating the same Idempotency-Key and body returns the same purchase
        (201 again); the same key with another body is a 409 `idempotency_conflict`. Requires X-CSRF-Token.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 80 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePurchaseRequest' } } }
      responses:
        '201':
          description: Purchase recorded, or the one recorded earlier with this key.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminPurchase' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/purchases/{id}:
    get:
      tags: [Administration]
      summary: Read a purchase
      parameters: [{ $ref: '#/components/parameters/PurchaseId' }]
      responses:
        '200':
          description: Purchase with its lines.
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminPurchase' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/purchases/{id}/receive:
    post:
      tags: [Administration]
      summary: Receive a purchase
      description: >-
        Allowed while the purchase is `ordered`. Every line of it still `ordered` becomes `received` as with the line
        action (a cancelled line's goods go to own stock); lines received one by one before are left as they are. The
        purchase becomes `received`. Requires X-CSRF-Token.
      parameters: [{ $ref: '#/components/parameters/PurchaseId' }]
      responses:
        '200': { $ref: '#/components/responses/PurchaseUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
  /api/admin/purchases/{id}/cancel:
    post:
      tags: [Administration]
      summary: Cancel a purchase before anything arrived
      description: >-
        Allowed while the purchase is `ordered` and none of its lines is `received` (409 `purchase_partly_received`,
        with `itemId`). Its `ordered` lines go back to `to_order` without a supplier reference (journal
        `purchase_cancelled` on each order with the reason); `failed` lines stay failed. The purchase keeps its lines
        for the record but no longer gives them an actual cost. Requires X-CSRF-Token.
      parameters: [{ $ref: '#/components/parameters/PurchaseId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } }
      responses:
        '200': { $ref: '#/components/responses/PurchaseUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ActionRefused' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/pricing-rules:
    get:
      tags: [Administration]
      summary: List pricing rules
      description: >-
        Every rule, active or not, default rules (categoryId null) first, then by category and cost band. The rule for a
        variant is the active one on the nearest category up the tree whose band contains the landed cost, otherwise the
        default rule whose band contains it.
      responses:
        '200':
          description: Pricing rules.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PricingRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Administration]
      summary: Create a pricing rule
      description: The band is minCostCzkMinor inclusive to maxCostCzkMinor exclusive (null = no upper limit). Active bands of one category may not overlap. Requires X-CSRF-Token.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleWriteRequest' } } }
      responses:
        '201':
          description: Rule created.
          content: { application/json: { schema: { $ref: '#/components/schemas/IdResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '409': { description: 'The band overlaps another active rule of the same category.', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/pricing-rules/{id}:
    put:
      tags: [Administration]
      summary: Update a pricing rule
      description: Replaces category, band, markup and active state. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PricingRuleWriteRequest' } } }
      responses:
        '200':
          description: Rule updated.
          content: { application/json: { schema: { $ref: '#/components/schemas/IdResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The band overlaps another active rule of the same category.', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Validation' }
    delete:
      tags: [Administration]
      summary: Delete a pricing rule
      description: Prices already set stay as they are. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Rule deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/variants/{id}/pricing:
    get:
      tags: [Administration]
      summary: Read the pricing panel of a variant
      description: Best offer and landed cost breakdown, rule used, suggested price, margins, RRP, market price, flags and availability.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Variant pricing.
          content: { application/json: { schema: { $ref: '#/components/schemas/VariantPricing' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/variants/{id}/pricing/apply:
    post:
      tags: [Administration]
      summary: Apply the suggested price to a variant
      description: >-
        Sets the variant's CZK and EUR price to the current suggestion and writes the price history with reason `reprice`.
        Send the suggested CZK price you showed; if the suggestion changed or disappeared since, nothing is applied and the
        answer is 409. A variant flagged `margin_too_low` can't be applied (422); set its price manually instead.
        Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suggestedPriceCzk]
              properties:
                suggestedPriceCzk: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Price applied (or already equal).
          content: { application/json: { schema: { $ref: '#/components/schemas/PriceApplied' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StalePrice' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/variants/{id}/price-history:
    get:
      tags: [Administration]
      summary: Read a variant's own price history
      description: 30 changes per page, newest first. The first entry of a variant created after D02 has null old prices. RRP is never part of this history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Price history page.
          content: { application/json: { schema: { $ref: '#/components/schemas/PriceHistoryPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/pricing/reprice:
    get:
      tags: [Administration]
      summary: Preview repricing
      description: >-
        One row per active variant (of draft and published products) in the category subtree, or the whole catalogue
        without categoryId, that has a suggested price. Variants without a fresh matched offer or without a rule are only
        counted. Rows with applicable false (flagged `margin_too_low`) can't be applied.
      parameters:
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reprice preview.
          content: { application/json: { schema: { $ref: '#/components/schemas/RepricePreview' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
    post:
      tags: [Administration]
      summary: Apply repricing to selected variants
      description: >-
        All or nothing. Each item carries the suggested CZK price the preview showed; if any suggestion changed or
        disappeared since, nothing is applied and the 409 lists those variants. A flagged or unknown variant is a 422.
        Every changed price is written to the history with reason `reprice`. Requires X-CSRF-Token.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RepriceApplyRequest' } } }
      responses:
        '200':
          description: Prices applied.
          content: { application/json: { schema: { $ref: '#/components/schemas/RepriceApplyResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '409': { $ref: '#/components/responses/StalePrice' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/pricing/alerts:
    get:
      tags: [Administration]
      summary: Count variants that need pricing attention
      description: Active variants of published products whose suggestion is flagged margin_too_low, whose current price is more than the set threshold above the market price, or whose availability is check_needed (variants with own stock left out, they sell from the shelf).
      responses:
        '200':
          description: Alert counts for the dashboard tile.
          content: { application/json: { schema: { $ref: '#/components/schemas/PricingAlerts' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/pricing/settings:
    get:
      tags: [Administration]
      summary: Read the pricing thresholds
      description: The app.pricing values the admin panels quote as numbers — the minimum margin a suggestion must keep and how far above the market price a flag fires. Basis points, 1000 = 10 %.
      responses:
        '200':
          description: Pricing thresholds.
          content: { application/json: { schema: { $ref: '#/components/schemas/PricingThresholds' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/imports/preview:
    post:
      tags: [Administration]
      summary: Preview a feed import from an uploaded file
      description: >-
        Parses the uploaded Awin CSV (plain UTF-8 with or without a BOM, or gzip), matches every row against the
        catalogue and returns the report; nothing but the run row itself is written. New rows of the same feed stay
        bounded: at most 20 000 data rows are read, each report list holds at most 200 rows with the complete counts
        on top. Requires X-CSRF-Token.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'The feed file, .csv or .csv.gz.' }
      responses:
        '200':
          description: The import report. The run it belongs to is journaled with status `previewed`.
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/imports/apply:
    post:
      tags: [Administration]
      summary: Apply a previewed import
      description: >-
        Writes the previewed report in one transaction; rows are independent, so one bad row never blocks the rest.
        Refuses with 409 (code `file_changed`) when the uploaded file's sha256 differs from the one the run previewed,
        and with 409 (code `already_applied`) when the run was already applied. New products are drafts with their
        variants; nothing is ever deleted — an offer missing from a newer feed just ages. Every written field records
        the run as its origin, and values the admin set or cleared are never overwritten. Requires X-CSRF-Token.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [runId, file]
              properties:
                runId: { type: string, format: uuid, description: 'The run the preview created.' }
                file: { type: string, format: binary, description: 'The same file the preview read.' }
      responses:
        '200':
          description: Applied; the written counts and the report the run ended with.
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportApplyResult' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ImportConflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/imports/runs:
    get:
      tags: [Administration]
      summary: List import runs, newest first
      description: The journal of seed and feed imports with their counts; the import-error log D05.5 points to.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: A page of import runs.
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportRunPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/imports/runs/{id}:
    get:
      tags: [Administration]
      summary: One import run with its report and per-row errors
      description: The stored report of the preview or apply, plus every per-row error, not only the first 200.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The run.
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportRunDetail' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/imports/settings:
    get:
      tags: [Administration]
      summary: Read the per-supplier import defaults
      description: The supplier-level default inbound shipping used by the import's cost report, set once per supplier. Suppliers without a row read as zero.
      responses:
        '200':
          description: Import settings per supplier.
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportSettingsList' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/admin/imports/settings/{supplier}:
    put:
      tags: [Administration]
      summary: Set the import defaults of one supplier
      description: Stores the default inbound shipping of the supplier's feed. An unknown supplier is a 422. Requires X-CSRF-Token.
      parameters:
        - { name: supplier, in: path, required: true, schema: { type: string, enum: [allegro_cz, allegro_pl, bikeinn, bike24, bike_discount, bike_components, other] } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ImportSettingWrite' } } }
      responses:
        '200':
          description: Saved.
          content: { application/json: { schema: { $ref: '#/components/schemas/ImportSetting' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Invalid CSRF token. }
        '422': { $ref: '#/components/responses/Validation' }
components:
  parameters:
    Locale:
      name: locale
      in: query
      schema: { type: string, enum: [cs, de, en], default: en }
    OrderId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    ItemId: { name: itemId, in: path, required: true, description: 'Order line id; a line of another order is not found.', schema: { type: string, format: uuid } }
    ShipmentId: { name: shipmentId, in: path, required: true, description: 'Shipment id; a shipment of another order is not found.', schema: { type: string, format: uuid } }
    PaymentId: { name: paymentId, in: path, required: true, description: 'Ledger entry id; an entry of another order is not found.', schema: { type: string, format: uuid } }
    PurchaseId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Unauthorized:
      description: No admin session.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource not found. An {id} that isn't a UUID is not found as well.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Request conflicts with existing data, such as a taken slug, SKU, EAN or listing, or with current stock or order state.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Validation:
      description: Request failed validation. `violations` is present when the body or query string itself was invalid; a rule checked later, such as an unknown category, gives only `message`.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    AdminOrderUpdated:
      description: Action done; the order as it is now.
      content: { application/json: { schema: { $ref: '#/components/schemas/AdminOrder' } } }
    ActionRefused:
      description: >-
        The action isn't allowed in the current state (code `action_not_allowed` with `action`; the order's `actions`
        and `corrections`, or the purchase's `actions`, list what is), the Idempotency-Key was used with another body
        (code `idempotency_conflict`), own stock no longer covers a re-planned shipment (code `not_enough_stock`), the
        target shipment is closed (code `shipment_closed`), a line can't be bought (code `line_not_purchasable`) or a
        purchase was partly received (code `purchase_partly_received`). Nothing was changed.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PurchaseUpdated:
      description: Done; the purchase as it is now.
      content: { application/json: { schema: { $ref: '#/components/schemas/AdminPurchase' } } }
    StalePrice:
      description: A suggested price changed since it was shown; nothing was applied. Load the preview or panel again.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                required: [staleVariantIds]
                properties:
                  staleVariantIds: { type: array, items: { type: string, format: uuid } }
    ImportConflict:
      description: >-
        The apply doesn't match the preview: the uploaded file's sha256 differs from the run's (code `file_changed`)
        or the run was already applied (code `already_applied`). Nothing was written.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [message]
      properties:
        message: { type: string, description: 'Readable summary; for request validation it lists each "field: message".' }
        code:
          type: string
          description: >-
            Machine-readable reason of a business-rule error. Checkout and quote: invalid_field (with violations),
            invalid_idempotency_key, product_unavailable, unavailable (both with variantId), method_unavailable (with
            reason), split_unavailable, quote_changed, idempotency_conflict. Admin orders: action_not_allowed (with
            action), idempotency_conflict, not_enough_stock, overpayment, refund_exceeds_paid, method_not_accepted,
            invalid_field, shipment_closed, void_exceeds_paid (with paidMinor). Purchases: invalid_idempotency_key,
            idempotency_conflict, invalid_field, line_not_purchasable, mixed_suppliers, purchase_partly_received (all
            three with itemId), action_not_allowed. Admin login: invalid_credentials.
        variantId: { type: string, format: uuid, description: The variant a checkout error is about. }
        action: { type: string, description: 'The refused admin action, with action_not_allowed.' }
        reason: { type: string, enum: [postal_code_required, invalid_postal_code, outside_prague, not_offered], description: 'Why the method is refused, with method_unavailable.' }
        amountDueMinor: { type: integer, description: 'What is still due, with overpayment.' }
        paidMinor: { type: integer, description: 'Net amount received, with refund_exceeds_paid and void_exceeds_paid.' }
        itemId: { type: string, format: uuid, description: 'The order line a purchase error is about.' }
        violations:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: [string, 'null'], description: 'Property path such as nameCs or attr[speeds]; null when the whole request is meant.' }
              message: { type: string }
    Category:
      type: object
      required: [id, slug, name, count, children]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        count: { type: integer, description: Published products in this category and its active subcategories. }
        children: { type: array, items: { $ref: '#/components/schemas/Category' } }
    Facets:
      type: object
      required: [category, brands, attributes]
      properties:
        category: { type: string }
        brands:
          type: array
          items: { type: object, required: [value, count], properties: { value: { type: string }, count: { type: integer } } }
        attributes:
          type: array
          items:
            type: object
            required: [key, label, type, values]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, number, choice] }
              unit: { type: [string, 'null'] }
              values:
                type: array
                items: { type: object, required: [value, label, count], properties: { value: { type: string }, label: { type: string }, count: { type: integer } } }
    Spec:
      type: object
      required: [key, label, value]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string, description: 'Display value, localized for choice attributes.' }
        unit: { type: [string, 'null'] }
    Price:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Minor currency units. }
        currency: { type: string, enum: [CZK, EUR] }
    Availability:
      type: object
      description: >-
        orderable - NODRA holds at least one unit itself (lead time = handling days), or a fresh matched offer with known
        lead time; check_needed - only stale, unmatched or incomplete offers, the shop confirms availability and date;
        unavailable - no own stock and no offers, or all rejected or sold out. Lead time is in days including handling and
        is null unless orderable. `stock`, `inStock` and `availableUnits` count NODRA's own stock only.
      required: [status, leadTimeMinDays, leadTimeMaxDays]
      properties:
        status: { type: string, enum: [orderable, check_needed, unavailable] }
        leadTimeMinDays: { type: [integer, 'null'] }
        leadTimeMaxDays: { type: [integer, 'null'] }
    ProductCard:
      type: object
      required: [id, slug, name, brand, category, categoryName, image, fromPrice, inStock, availableUnits, availability]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        brand: { type: [string, 'null'] }
        category: { type: string, description: Category slug. }
        categoryName: { type: string }
        image: { type: string }
        fromPrice: { $ref: '#/components/schemas/Price' }
        inStock: { type: boolean }
        availableUnits: { type: integer, minimum: 0 }
        availability:
          allOf: [{ $ref: '#/components/schemas/Availability' }]
          description: 'Best status among the active variants (orderable, then check_needed, then unavailable); for orderable the shortest lead time.'
        badge: { type: string, nullable: true }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [description, details, images, breadcrumbs, specs, inBox, variants]
          properties:
            short: { type: string }
            description: { type: string }
            details: { type: array, items: { type: string } }
            images: { type: array, items: { type: string } }
            breadcrumbs:
              type: array
              description: Category path from the root to the product's category.
              items: { type: object, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
            specs: { type: array, description: Product-level attribute values., items: { $ref: '#/components/schemas/Spec' } }
            inBox: { type: [string, 'null'], description: Localized package contents. }
            variants:
              type: array
              items:
                type: object
                required: [id, sku, label, price, stock, mpn, ean, specs, availability]
                properties:
                  id: { type: string, format: uuid }
                  sku: { type: string }
                  label: { type: string }
                  price: { $ref: '#/components/schemas/Price' }
                  stock: { type: integer }
                  availability: { $ref: '#/components/schemas/Availability' }
                  mpn: { type: [string, 'null'] }
                  ean: { type: [string, 'null'], pattern: '^(\d{8}|\d{12,14})$', description: Digits only. }
                  specs: { type: array, description: Values set on this variant; they override product values with the same key., items: { $ref: '#/components/schemas/Spec' } }
    BasketItem:
      type: object
      required: [variantId, quantity]
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 10, description: At most 10 units of one variant per order. }
    DeliveryMethod:
      type: string
      enum: [pickup_andel, prague_personal, carrier_cz]
      description: 'pickup_andel - free pickup at Anděl; prague_personal - NODRA delivers in person, postal codes 100 00-199 99; carrier_cz - carrier within Czechia, offered only once its tariff is set.'
    QuoteRequest:
      type: object
      required: [locale, items, delivery]
      properties:
        locale: { type: string, enum: [cs, de, en], description: Language of the product names. Prices are CZK in every language. }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/BasketItem' } }
        delivery:
          type: object
          required: [method]
          properties:
            method: { $ref: '#/components/schemas/DeliveryMethod' }
            postalCode: { type: [string, 'null'], description: 'Needed for prague_personal and carrier_cz; "11000" or "110 00".' }
    CheckoutQuote:
      type: object
      required: [currency, lines, subtotal, methods, delivery, options, canCheckout]
      properties:
        currency: { type: string, enum: [CZK] }
        lines:
          type: array
          items:
            type: object
            required: [variantId, name, variant, sku, quantity, unitPrice, lineTotal, availability]
            properties:
              variantId: { type: string, format: uuid }
              name: { type: string }
              variant: { type: string }
              sku: { type: string }
              quantity: { type: integer }
              unitPrice: { type: integer, description: Haléře. }
              lineTotal: { type: integer, description: Haléře. }
              availability: { $ref: '#/components/schemas/Availability' }
        subtotal: { $ref: '#/components/schemas/Price' }
        methods:
          type: array
          description: "Methods offered at all, with whether they work for this postal code. carrier_cz is missing while its tariff isn't set."
          items:
            type: object
            required: [method, available, reason, fee, note, freeFromMinor]
            properties:
              method: { $ref: '#/components/schemas/DeliveryMethod' }
              available: { type: boolean }
              reason: { type: [string, 'null'], enum: [postal_code_required, invalid_postal_code, outside_prague, null] }
              fee: { oneOf: [{ $ref: '#/components/schemas/Price' }, { type: 'null' }], description: 'Fee per shipment for this basket, null when not available.' }
              note: { type: [string, 'null'], description: 'Pickup place and time note for pickup_andel, in the request locale.' }
              freeFromMinor: { type: [integer, 'null'], description: 'Goods subtotal in haléře from which the method is free (50000 for prague_personal); null when its fee does not depend on it.' }
        delivery:
          type: object
          required: [method, postalCode]
          properties:
            method: { $ref: '#/components/schemas/DeliveryMethod' }
            postalCode: { type: [string, 'null'], description: 'Normalized as "110 00"; null when missing or invalid.' }
        options:
          type: [object, 'null']
          required: [together, split]
          properties:
            together: { $ref: '#/components/schemas/DeliveryOption' }
            split: { oneOf: [{ $ref: '#/components/schemas/DeliveryOption' }, { type: 'null' }], description: 'Null with fewer than two groups of lines.' }
        canCheckout: { type: boolean }
    DeliveryOption:
      type: object
      required: [fulfilment, shipments, shipping, total]
      properties:
        fulfilment: { type: string, enum: [together, split] }
        shipments:
          type: array
          items:
            type: object
            required: [number, variantIds, leadTimeMinDays, leadTimeMaxDays, fee]
            properties:
              number: { type: integer, minimum: 1 }
              variantIds: { type: array, items: { type: string, format: uuid } }
              leadTimeMinDays: { type: [integer, 'null'], description: "Null when a line's date is still to be confirmed." }
              leadTimeMaxDays: { type: [integer, 'null'] }
              fee: { $ref: '#/components/schemas/Price' }
        shipping: { $ref: '#/components/schemas/Price' }
        total: { $ref: '#/components/schemas/Price', description: Send total.amount as expectedTotal. }
    CheckoutRequest:
      type: object
      required: [locale, customer, items, delivery, consents, expectedTotal]
      properties:
        locale: { type: string, enum: [cs, de, en] }
        customer:
          type: object
          required: [name, email, phone, contactChannel]
          description: Street address, city and postal code are required for prague_personal and carrier_cz and ignored for pickup_andel.
          properties:
            name: { type: string, maxLength: 160 }
            email: { type: string, format: email }
            phone: { type: string, description: '"+" and 9 to 15 digits once spaces are removed; a bare 9-digit number is taken as +420. Stored as +420777123456.' }
            contactChannel: { type: string, enum: [whatsapp, telegram, phone] }
            country: { type: string, enum: [CZ], default: CZ }
            address: { type: string, maxLength: 255 }
            city: { type: string, maxLength: 120 }
            postalCode: { type: string, pattern: '^\\d{3}\\s?\\d{2}$' }
            district: { type: [string, 'null'], maxLength: 120 }
            deliveryNote: { type: [string, 'null'], maxLength: 500 }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/BasketItem' } }
        delivery:
          type: object
          required: [method, fulfilment]
          properties:
            method: { $ref: '#/components/schemas/DeliveryMethod' }
            fulfilment: { type: string, enum: [together, split] }
        consents:
          type: object
          required: [privacy]
          properties:
            privacy: { type: boolean, description: 'Must be true; the time and the text version are stored with the order.' }
            marketing: { type: boolean, default: false, description: 'Optional newsletter consent, stored with its own time.' }
        expectedTotal: { type: integer, minimum: 0, description: 'total.amount of the chosen option in the quote the customer saw, haléře.' }
        promotionCode: { type: [string, 'null'], description: 'Not available yet; anything but null is refused.' }
    ProductWriteRequest:
      type: object
      required: [slug, category, nameCs, nameDe, nameEn, shortCs, shortDe, shortEn, image, status, priceCzk, priceEur]
      properties:
        slug: { type: string, maxLength: 120 }
        category: { type: string, description: Slug of an active category. }
        brand: { type: [string, 'null'], maxLength: 80 }
        attributes: { $ref: '#/components/schemas/AttributeValues' }
        inBoxCs: { type: [string, 'null'], maxLength: 500 }
        inBoxDe: { type: [string, 'null'], maxLength: 500 }
        inBoxEn: { type: [string, 'null'], maxLength: 500 }
        nameCs: { type: string }
        nameDe: { type: string }
        nameEn: { type: string }
        shortCs: { type: string }
        shortDe: { type: string }
        shortEn: { type: string }
        image: { type: string }
        status: { type: string, enum: [draft, published] }
        priceCzk: { type: integer, minimum: 0 }
        priceEur: { type: integer, minimum: 0 }
        badge: { type: [string, 'null'] }
        featuredRank: { type: integer }
    VariantWriteRequest:
      type: object
      required: [sku, labelCs, labelDe, labelEn, priceCzk, priceEur]
      properties:
        sku: { type: string, maxLength: 80 }
        labelCs: { type: string }
        labelDe: { type: string }
        labelEn: { type: string }
        priceCzk: { type: integer, minimum: 0 }
        priceEur: { type: integer, minimum: 0 }
        active: { type: boolean }
        color: { type: [string, 'null'] }
        size: { type: [string, 'null'] }
        mpn: { type: [string, 'null'], maxLength: 64, description: Manufacturer part number. }
        ean:
          type: [string, 'null']
          maxLength: 20
          description: 'GTIN-8/12/13/14 with a valid check digit, unique across variants. Spaces and dashes are accepted and stripped, so "859 4000-000013" is stored and returned as 8594000000013. Empty clears it.'
        attributes: { $ref: '#/components/schemas/AttributeValues' }
        rrpMinor: { type: [integer, 'null'], minimum: 1, description: "Manufacturer's recommended retail price, admin-only reference. Never shown as a previous NODRA price." }
        rrpCurrency: { type: [string, 'null'], enum: [CZK, EUR, null], description: Required with rrpMinor. An EUR RRP is converted at the EUR display rate for the price cap. }
        rrpSource: { type: [string, 'null'], maxLength: 500, description: URL or short note. }
        rrpCheckedAt: { type: [string, 'null'], format: date }
        marketPriceMinor: { type: [integer, 'null'], minimum: 1, description: 'Lowest price a Czech customer would realistically pay elsewhere, in haléře. Admin-only.' }
        marketPriceSource: { type: [string, 'null'], maxLength: 500 }
        marketCheckedAt: { type: [string, 'null'], format: date }
    AttributeValues:
      type: object
      description: Values keyed by attribute key from the category's effective definitions. Values are strings; number attributes hold a decimal string and choice attributes one option value. An empty value removes the key. Always a JSON object, {} when there are none.
      additionalProperties: { type: string, maxLength: 80 }
    AttributeDefinition:
      type: object
      required: [key, type, labelCs, labelDe, labelEn, filterable]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        type: { type: string, enum: [text, number, choice] }
        unit: { type: [string, 'null'], maxLength: 12 }
        labelCs: { type: string }
        labelDe: { type: string }
        labelEn: { type: string }
        filterable: { type: boolean }
        options:
          type: array
          description: Required for choice attributes.
          items:
            type: object
            required: [value]
            properties:
              value: { type: string, maxLength: 80 }
              labelCs: { type: [string, 'null'] }
              labelDe: { type: [string, 'null'] }
              labelEn: { type: [string, 'null'] }
    AdminCategory:
      type: object
      required: [id, slug, parentId, depth, names, position, active, attributes, effectiveAttributes, productCount]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        depth: { type: integer, minimum: 0, description: 'Level in the tree, 0 for a root; the list is ordered depth-first.' }
        names: { type: object, properties: { cs: { type: string }, de: { type: string }, en: { type: string } } }
        position: { type: integer }
        active: { type: boolean }
        attributes: { type: array, items: { $ref: '#/components/schemas/AttributeDefinition' } }
        effectiveAttributes: { type: array, items: { $ref: '#/components/schemas/AttributeDefinition' } }
        productCount: { type: integer, description: 'Products directly in this category, any status.' }
    AdminProductPage:
      type: object
      required: [items, page, pages, total]
      properties:
        page: { type: integer }
        pages: { type: integer }
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, slug, category, categoryId, brand, attributes, status, name, copy, image, badge, featuredRank, supplierOffers, variants]
            properties:
              id: { type: string, format: uuid }
              slug: { type: string }
              category: { type: string, description: Category slug. }
              categoryId: { type: string, format: uuid }
              brand: { type: [string, 'null'] }
              attributes: { $ref: '#/components/schemas/AttributeValues' }
              status: { type: string, enum: [draft, published, archived] }
              name: { type: string, description: English name. }
              copy: { type: object, description: 'Per locale: name, short, description, details and optional inBox.' }
              image: { type: string }
              badge: { type: [string, 'null'] }
              featuredRank: { type: integer }
              supplierOffers: { type: array, items: { $ref: '#/components/schemas/AdminSupplierOffer' } }
              variants:
                type: array
                items:
                  type: object
                  required: [id, sku, label, priceCzk, priceEur, stock, active, color, size, mpn, ean, attributes, rrpMinor, rrpCurrency, rrpSource, rrpCheckedAt, marketPriceMinor, marketPriceSource, marketCheckedAt]
                  properties:
                    id: { type: string, format: uuid }
                    sku: { type: string }
                    label: { type: object, properties: { cs: { type: string }, de: { type: string }, en: { type: string } } }
                    priceCzk: { type: integer }
                    priceEur: { type: integer }
                    stock: { type: integer }
                    active: { type: boolean }
                    color: { type: [string, 'null'] }
                    size: { type: [string, 'null'] }
                    mpn: { type: [string, 'null'] }
                    ean: { type: [string, 'null'], description: Digits only. }
                    attributes: { $ref: '#/components/schemas/AttributeValues' }
                    rrpMinor: { type: [integer, 'null'] }
                    rrpCurrency: { type: [string, 'null'] }
                    rrpSource: { type: [string, 'null'] }
                    rrpCheckedAt: { type: [string, 'null'], format: date }
                    marketPriceMinor: { type: [integer, 'null'] }
                    marketPriceSource: { type: [string, 'null'] }
                    marketCheckedAt: { type: [string, 'null'], format: date }
    AdminSupplierOffer:
      type: object
      required: [id, variantId, supplier, seller, url, title, currency, priceMinor, inboundShippingMinor, fxRateCzk, fxRateDate, reportedQuantity, checkedAt, leadTimeMinDays, leadTimeMaxDays, verificationStatus]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: [string, 'null'], format: uuid }
        supplier: { type: string }
        seller: { type: [string, 'null'] }
        url: { type: string }
        title: { type: string }
        currency: { type: string }
        priceMinor: { type: integer }
        inboundShippingMinor: { type: integer, description: Delivery to NODRA per unit in the offer currency. }
        fxRateCzk: { type: [integer, 'null'], description: "CZK per offer-currency unit in millionths; 1000000 for CZK. Null means unknown, the offer can't be priced." }
        fxRateDate: { type: [string, 'null'], format: date }
        reportedQuantity: { type: [integer, 'null'] }
        checkedAt: { type: string, format: date-time, description: 'ISO 8601 with the UTC offset, e.g. 2026-09-26T22:00:00+00:00.' }
        leadTimeMinDays: { type: [integer, 'null'] }
        leadTimeMaxDays: { type: [integer, 'null'] }
        verificationStatus: { type: string, enum: [snapshot, matched, rejected] }
    CategoryWriteRequest:
      type: object
      required: [slug, nameCs, nameDe, nameEn]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 60 }
        parentId: { type: [string, 'null'], format: uuid }
        nameCs: { type: string }
        nameDe: { type: string }
        nameEn: { type: string }
        position: { type: integer, default: 0 }
        active: { type: boolean, default: true }
        attributes: { type: array, items: { $ref: '#/components/schemas/AttributeDefinition' } }
    SupplierOfferWriteRequest:
      type: object
      required: [supplier, url, title, currency, priceMinor, checkedAt, verificationStatus]
      properties:
        supplier: { type: string, enum: [allegro_cz, allegro_pl, bikeinn, bike24, bike_discount, other] }
        url: { type: string, format: uri, maxLength: 2048 }
        title: { type: string, maxLength: 200 }
        seller: { type: [string, 'null'], maxLength: 120 }
        currency: { type: string, enum: [CZK, EUR, PLN] }
        priceMinor: { type: integer, minimum: 0 }
        reportedQuantity: { type: [integer, 'null'], minimum: 0 }
        checkedAt: { type: string, format: date-time }
        leadTimeMinDays: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        leadTimeMaxDays: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        variantId: { type: [string, 'null'], format: uuid }
        verificationStatus: { type: string, enum: [snapshot, matched, rejected], description: 'snapshot: not checked against a variant; matched: confirmed exact variant; rejected: listing does not match.' }
        inboundShippingMinor: { type: integer, minimum: 0, default: 0, description: Delivery to NODRA per unit in the offer currency. }
        fxRateCzk: { type: [integer, 'null'], minimum: 1, description: 'CZK per offer-currency unit in millionths. For CZK leave it out or send 1000000; for EUR/PLN null means unknown and the offer is not used for price or availability.' }
        fxRateDate: { type: [string, 'null'], format: date, description: Date of the exchange rate. }
    OrderStatus:
      type: string
      enum: [requested, confirmed, completed, cancelled]
      description: 'requested - NODRA still checks the offer and agrees price and date with the customer; confirmed - the customer agreed; completed - every active line delivered and paid; cancelled.'
    PaymentStatus:
      type: string
      enum: [unpaid, partially_paid, paid, partially_refunded, refunded]
      description: >-
        From the ledger: unpaid - nothing received; partially_paid / paid - received less than / at least the current
        total, no refund yet; partially_refunded / refunded - some / all of the money went back. A cancelled line or
        order lowers the total, so money already taken stays `paid` and shows as refundDue until the refund is recorded.
    ShipmentStatus:
      type: string
      enum: [planned, scheduled, handed_over, refused, cancelled]
    OrderReceipt:
      type: object
      required: [reference, status, paymentStatus, createdAt, fulfilment, contactChannel, paymentMethods, items, shipments, pickupNote, subtotal, shipping, total, paid, amountDue, lookupToken]
      properties:
        reference: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        createdAt: { type: string, format: date-time }
        fulfilment: { type: string, enum: [together, split] }
        contactChannel: { type: [string, 'null'], enum: [whatsapp, telegram, phone, null], description: 'How NODRA gets in touch, as chosen at checkout; null on orders placed before D04.' }
        paymentMethods:
          type: array
          items: { type: string, enum: [cash, bank_transfer, card, carrier_cod] }
          description: >-
            The payment methods the shop accepts on handover right now, from the shop settings. The storefront
            shows only these and never assumes a method on its own.
        items: { type: array, items: { $ref: '#/components/schemas/ReceiptItem' } }
        shipments:
          type: array
          items:
            type: object
            required: [number, method, status, fee, leadTimeMinDays, leadTimeMaxDays, scheduledFrom, scheduledTo]
            properties:
              number: { type: integer, minimum: 1 }
              method: { $ref: '#/components/schemas/DeliveryMethod' }
              status: { $ref: '#/components/schemas/ShipmentStatus' }
              fee: { $ref: '#/components/schemas/Price' }
              leadTimeMinDays: { type: [integer, 'null'], description: 'Slowest active line; null while a date is to be confirmed.' }
              leadTimeMaxDays: { type: [integer, 'null'] }
              scheduledFrom: { type: [string, 'null'], format: date-time, description: 'Agreed window, once scheduled.' }
              scheduledTo: { type: [string, 'null'], format: date-time }
        pickupNote: { type: [string, 'null'], description: 'Where and how pickup works, for pickup_andel shipments, in the order language.' }
        subtotal: { $ref: '#/components/schemas/Price' }
        shipping: { $ref: '#/components/schemas/Price' }
        total: { $ref: '#/components/schemas/Price' }
        paid: { $ref: '#/components/schemas/Price', description: Received minus refunded. }
        amountDue: { $ref: '#/components/schemas/Price', description: Still to pay on receipt. }
        lookupToken: { type: string }
    ReceiptItem:
      type: object
      required: [name, variant, sku, quantity, unitPrice, lineTotal, state, leadTimeMinDays, leadTimeMaxDays, shipment]
      properties:
        name: { type: string }
        variant: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        unitPrice: { type: integer }
        lineTotal: { type: integer }
        state: { type: string, enum: [active, cancelled, returned] }
        leadTimeMinDays: { type: [integer, 'null'], description: 'Days including handling; null while the date is to be confirmed.' }
        leadTimeMaxDays: { type: [integer, 'null'] }
        shipment: { type: integer, description: Number of the shipment the line travels in. }
    CustomerAgreement:
      type: object
      required: [channel, note]
      description: 'How the customer agreed; written to the journal.'
      properties:
        channel: { type: string, enum: [whatsapp, telegram, phone, email, in_person] }
        note: { type: string, minLength: 1, maxLength: 500 }
    ConfirmOrderRequest:
      type: object
      required: [customerAgreedVia]
      properties:
        customerAgreedVia: { $ref: '#/components/schemas/CustomerAgreement' }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    LineTermsRequest:
      type: object
      description: 'At least the price or the lead time. Lead time is set as a pair.'
      properties:
        unitPriceMinor: { type: [integer, 'null'], minimum: 0, description: New unit price in the order currency. }
        leadTimeMinDays: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        leadTimeMaxDays: { type: [integer, 'null'], minimum: 0, maximum: 365 }
        customerAgreedVia: { oneOf: [{ $ref: '#/components/schemas/CustomerAgreement' }, { type: 'null' }], description: 'Optional; a confirmed order goes back to requested anyway.' }
    MarkOrderedRequest:
      type: object
      required: [supplierReference]
      properties:
        supplierReference: { type: string, minLength: 1, maxLength: 120, description: 'Supplier order number or link, admin-only.' }
    ReplacementRequest:
      type: object
      required: [variantId, customerAgreedVia]
      properties:
        variantId: { type: string, format: uuid, description: Any active variant. }
        quantity: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        unitPriceMinor: { type: [integer, 'null'], minimum: 0 }
        customerAgreedVia: { $ref: '#/components/schemas/CustomerAgreement' }
    ScheduleShipmentRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: After from. }
    RecordPaymentRequest:
      type: object
      required: [kind, method, amountMinor]
      properties:
        kind: { type: string, enum: [payment, refund] }
        method: { type: string, enum: [cash, bank_transfer, card, carrier_cod], description: 'Accepted now: cash, bank_transfer (app.payment.handover_methods); carrier_cod for payments once carrier cash on delivery is set up.' }
        amountMinor: { type: integer, minimum: 1 }
        shipmentId: { type: [string, 'null'], format: uuid, description: 'The shipment the money came with, optional.' }
        note: { type: [string, 'null'], maxLength: 500 }
    AdminOrderPage:
      type: object
      required: [items, page, pages, total]
      properties:
        page: { type: integer }
        pages: { type: integer }
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/AdminOrderRow' } }
    AdminOrderRow:
      type: object
      required: [id, reference, status, paymentStatus, customerName, email, phone, country, total, createdAt, delayed, queues]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        customerName: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'], description: 'Null on orders placed before D04.' }
        country: { type: string }
        total: { $ref: '#/components/schemas/Price' }
        createdAt: { type: string, format: date-time }
        delayed: { type: boolean, description: 'An active ordered line is past its promised date.' }
        queues: { type: array, items: { $ref: '#/components/schemas/OrderQueue' }, description: 'Queues the order is in, in the order of OrderQueue.' }
    OrderQueue:
      type: string
      enum: [review, problem, to_purchase, waiting, delayed, to_schedule, delivering, unpaid, refund]
      description: See GET /api/admin/queues for when an order is in each.
    QueueCounts:
      type: object
      required: [review, problem, to_purchase, waiting, delayed, to_schedule, delivering, unpaid, refund]
      properties:
        review: { type: integer }
        problem: { type: integer }
        to_purchase: { type: integer }
        waiting: { type: integer }
        delayed: { type: integer }
        to_schedule: { type: integer }
        delivering: { type: integer }
        unpaid: { type: integer }
        refund: { type: integer }
    AdminDashboard:
      type: object
      required: [orders, openOrders, revenueCzkMinor, revenueEurMinor, products, ownStock, ownStockVariants, queues, recentOrders]
      properties:
        orders: { type: integer }
        openOrders: { type: integer, description: requested or confirmed. }
        revenueCzkMinor: { type: integer }
        revenueEurMinor: { type: integer, description: Older EUR demo orders only. }
        products: { type: integer, description: Published products. }
        ownStock:
          type: array
          description: 'Up to 20 variants NODRA holds itself (stock above zero, any card state), lowest stock first.'
          items:
            type: object
            required: [id, sku, stock, product]
            properties:
              id: { type: string, format: uuid }
              sku: { type: string }
              stock: { type: integer, minimum: 1 }
              product: { type: [string, 'null'], description: English product name. }
        ownStockVariants: { type: integer, description: 'All variants with own stock, the list above shows up to 20.' }
        queues: { $ref: '#/components/schemas/QueueCounts' }
        recentOrders: { type: array, items: { $ref: '#/components/schemas/AdminOrderRow' }, description: The 5 newest orders. }
    AdminSettings:
      type: object
      required: [currency, payment, delivery, privacyVersion]
      properties:
        currency: { type: string, enum: [CZK], description: Currency of every new order. }
        payment:
          type: object
          required: [handoverMethods, paymentMethods, refundMethods]
          properties:
            handoverMethods: { type: array, items: { type: string, enum: [cash, bank_transfer, card] }, description: 'Taken at handover.' }
            paymentMethods: { type: array, items: { type: string, enum: [cash, bank_transfer, card, carrier_cod] }, description: 'Accepted for kind payment: the handover methods, plus carrier_cod once carrier cash on delivery is set up.' }
            refundMethods: { type: array, items: { type: string, enum: [cash, bank_transfer, card] }, description: 'Accepted for kind refund.' }
        delivery:
          type: object
          required: [methods, pragueFeeMinor, pragueFreeFromMinor, carrierFeeMinor, carrierCodFeeMinor, pickupNote]
          properties:
            methods: { type: array, items: { $ref: '#/components/schemas/DeliveryMethod' }, description: Methods offered at checkout. }
            pragueFeeMinor: { type: integer }
            pragueFreeFromMinor: { type: integer }
            carrierFeeMinor: { type: [integer, 'null'], description: Null while carrier delivery is off. }
            carrierCodFeeMinor: { type: [integer, 'null'] }
            pickupNote:
              type: object
              required: [cs, de, en]
              properties:
                cs: { type: string }
                de: { type: string }
                en: { type: string }
        privacyVersion: { type: string, description: Stored with every privacy consent. }
    AdminOrder:
      type: object
      required: [id, reference, status, paymentStatus, locale, currency, fulfilment, createdAt, confirmedAt, queues, delayed, customer, consents, items, shipments, payments, events, subtotal, shipping, total, paid, amountDue, refundDue, economics, lookupToken, actions]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        locale: { type: string, enum: [cs, de, en] }
        currency: { type: string, enum: [CZK, EUR] }
        fulfilment: { type: string, enum: [together, split], description: 'As chosen at checkout; moving lines later does not change it.' }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time, description: 'Latest customer agreement; promised dates count from it. Null before confirmation and on orders confirmed before D05 without a journal entry.' }
        queues: { type: array, items: { $ref: '#/components/schemas/OrderQueue' } }
        delayed: { type: boolean, description: 'An active ordered line is past its promised date.' }
        customer:
          type: object
          required: [name, email, phone, contactChannel, country, address, city, postalCode, district, deliveryNote, accountId]
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: [string, 'null'] }
            contactChannel: { type: [string, 'null'], enum: [whatsapp, telegram, phone, null] }
            country: { type: string }
            address: { type: string, description: Empty for pickup. }
            city: { type: string }
            postalCode: { type: string }
            district: { type: string }
            deliveryNote: { type: [string, 'null'] }
            accountId: { type: [string, 'null'], format: uuid }
        consents:
          type: object
          required: [privacyConsentedAt, privacyTextVersion, marketing, marketingConsentedAt]
          properties:
            privacyConsentedAt: { type: [string, 'null'], format: date-time, description: 'Null on orders placed before D04.' }
            privacyTextVersion: { type: [string, 'null'] }
            marketing: { type: boolean }
            marketingConsentedAt: { type: [string, 'null'], format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/AdminOrderItem' } }
        shipments: { type: array, items: { $ref: '#/components/schemas/AdminShipment' } }
        payments: { type: array, items: { $ref: '#/components/schemas/AdminPayment' } }
        events:
          type: array
          description: 'The journal, oldest first. Nothing in it is ever edited or deleted.'
          items:
            type: object
            required: [id, type, data, actor, createdAt]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, description: 'placed, confirmed, terms_changed, item_ordered (with purchaseId when bought in a purchase), item_received (likewise), item_failed, item_cancelled, replacement_added, item_returned, shipment_scheduled, shipment_handed_over, shipment_refused, shipment_cancelled, payment_recorded, refund_recorded, cancelled, completed, loyalty_adjusted, migrated; corrections (each with reason): item_moved, item_receipt_undone, shipment_rescheduled, entry_voided; purchase_cancelled' }
              data: { type: object, description: 'Details of the event, such as the line, the reason, customerAgreedVia or the amounts.' }
              actor: { type: string, description: 'customer, system or the admin email.' }
              createdAt: { type: string, format: date-time }
        subtotal: { $ref: '#/components/schemas/Price', description: Active lines. }
        shipping: { $ref: '#/components/schemas/Price', description: Fees of shipments that are not cancelled. }
        total: { $ref: '#/components/schemas/Price' }
        paid: { $ref: '#/components/schemas/Price', description: Payments minus refunds. }
        amountDue: { $ref: '#/components/schemas/Price' }
        refundDue: { $ref: '#/components/schemas/Price', description: Money taken above the current total. }
        economics: { oneOf: [{ $ref: '#/components/schemas/OrderEconomics' }, { type: 'null' }], description: 'Null on the older EUR demo orders.' }
        lookupToken: { type: string }
        actions:
          type: array
          description: Order actions allowed right now.
          items: { type: string, enum: [confirm, cancel, record_payment, record_refund] }
    OrderEconomics:
      type: object
      description: 'CZK orders only, all haléře. Active lines count; cost is the actual unit cost of a line where it was bought in a purchase, else its checkout snapshot, times quantity.'
      required: [goodsRevenueMinor, shippingChargedMinor, costMinor, expectedResultMinor, marginBp, costComplete, unknownCostLines]
      properties:
        goodsRevenueMinor: { type: integer, description: Active lines. }
        shippingChargedMinor: { type: integer, description: 'Shown next to the result, not in it.' }
        costMinor: { type: integer }
        expectedResultMinor: { type: integer, description: goodsRevenueMinor - costMinor. }
        marginBp: { type: [integer, 'null'], description: 'Result over cost in basis points, rounded down, the way the pricing panel shows margins; null while cost is 0.' }
        costComplete: { type: boolean, description: 'Every active line has an actual cost from a purchase (never for own stock lines).' }
        unknownCostLines: { type: integer, description: 'Active lines with neither an actual nor a snapshot cost; they count as 0.' }
    OfferSource:
      type: object
      description: 'The supplier offer a line was priced from at checkout, as it is now. Admin-only.'
      required: [id, supplier, seller, url, currency, priceMinor, inboundShippingMinor, fxRateCzk, fxRateDate]
      properties:
        id: { type: string, format: uuid }
        supplier: { type: string }
        seller: { type: [string, 'null'] }
        url: { type: string }
        currency: { type: string, enum: [CZK, EUR, PLN] }
        priceMinor: { type: integer, description: Offer currency. }
        inboundShippingMinor: { type: integer, description: 'Per unit, offer currency.' }
        fxRateCzk: { type: [integer, 'null'] }
        fxRateDate: { type: [string, 'null'], format: date }
    AdminOrderItem:
      type: object
      required: [id, variantId, name, variant, sku, mpn, ean, quantity, unitPrice, lineTotal, state, procurementStatus, supplierReference, shipmentId, replacesItemId, availabilityStatus, leadTimeMinDays, leadTimeMaxDays, supplierOfferId, offer, unitCostCzkMinor, actualUnitCostCzkMinor, purchase, promisedDate, delayed, actions, corrections]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        variant: { type: string }
        sku: { type: string }
        mpn: { type: [string, 'null'], description: "The exact variant's manufacturer part number, as the variant has it now." }
        ean: { type: [string, 'null'] }
        quantity: { type: integer }
        unitPrice: { type: integer }
        lineTotal: { type: integer }
        state: { type: string, enum: [active, cancelled, returned] }
        procurementStatus: { type: string, enum: [from_stock, to_order, ordered, received, failed], description: 'from_stock - own stock reserved at checkout; to_order - to buy after confirmation; ordered; received; failed.' }
        supplierReference: { type: [string, 'null'] }
        shipmentId: { type: string, format: uuid }
        replacesItemId: { type: [string, 'null'], format: uuid, description: The failed line this one replaces. }
        availabilityStatus: { type: [string, 'null'], enum: [orderable, check_needed, unavailable, null], description: 'Snapshot taken at checkout; null on orders placed before D02.' }
        leadTimeMinDays: { type: [integer, 'null'] }
        leadTimeMaxDays: { type: [integer, 'null'] }
        supplierOfferId: { type: [string, 'null'], format: uuid }
        offer: { oneOf: [{ $ref: '#/components/schemas/OfferSource' }, { type: 'null' }], description: 'Null without an offer at checkout or when it was deleted since.' }
        unitCostCzkMinor: { type: [integer, 'null'], description: 'Landed cost per unit at checkout (snapshot), in haléře.' }
        actualUnitCostCzkMinor: { type: [integer, 'null'], description: 'From the purchase line when the line was bought in a purchase that is not cancelled; null otherwise (also after the one-line mark ordered action).' }
        purchase:
          type: [object, 'null']
          required: [id, reference, status]
          properties:
            id: { type: string, format: uuid }
            reference: { type: string }
            status: { type: string, enum: [ordered, received] }
        promisedDate: { type: [string, 'null'], format: date, description: 'Prague day the order was last confirmed + leadTimeMaxDays; null without either.' }
        delayed: { type: boolean, description: 'Active, still ordered, and today is after promisedDate.' }
        actions:
          type: array
          description: Line actions allowed right now.
          items: { type: string, enum: [change_terms, mark_ordered, mark_received, mark_failed, cancel, replace, return] }
        corrections:
          type: array
          description: Corrections allowed right now (each needs a reason).
          items: { type: string, enum: [move, undo_received] }
    AdminShipment:
      type: object
      required: [id, number, method, status, fee, leadTimeMinDays, leadTimeMaxDays, scheduledFrom, scheduledTo, handedOverAt, ready, itemIds, actions, corrections]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        method: { $ref: '#/components/schemas/DeliveryMethod' }
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        fee: { $ref: '#/components/schemas/Price', description: Fixed at checkout. }
        leadTimeMinDays: { type: [integer, 'null'] }
        leadTimeMaxDays: { type: [integer, 'null'] }
        scheduledFrom: { type: [string, 'null'], format: date-time }
        scheduledTo: { type: [string, 'null'], format: date-time }
        handedOverAt: { type: [string, 'null'], format: date-time }
        ready: { type: boolean, description: 'Every active line is from_stock or received; false for refused and cancelled shipments.' }
        itemIds: { type: array, items: { type: string, format: uuid } }
        actions:
          type: array
          items: { type: string, enum: [schedule, hand_over, refuse] }
        corrections:
          type: array
          description: 'reschedule on a scheduled shipment of a confirmed order (schedule still accepts it too, without a reason).'
          items: { type: string, enum: [reschedule] }
    AdminPayment:
      type: object
      required: [id, kind, method, amount, shipmentId, recordedAt, recordedBy, note, correctsId, voidedById, corrections]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [payment, refund, correction], description: 'A correction cancels the amount of the entry it points at.' }
        method: { type: string, enum: [cash, bank_transfer, card, carrier_cod] }
        amount: { $ref: '#/components/schemas/Price' }
        shipmentId: { type: [string, 'null'], format: uuid }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string }
        note: { type: [string, 'null'], description: 'For a correction, the reason it was voided.' }
        correctsId: { type: [string, 'null'], format: uuid, description: 'The entry a correction voids.' }
        voidedById: { type: [string, 'null'], format: uuid, description: 'The correction that voided this entry.' }
        corrections:
          type: array
          description: 'void, once, on a payment or refund.'
          items: { type: string, enum: [void] }
    MoveLineRequest:
      type: object
      required: [reason]
      properties:
        shipmentId: { type: [string, 'null'], format: uuid, description: 'Another planned or scheduled shipment of the order; null or missing starts a new part with fee 0.' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RescheduleShipmentRequest:
      type: object
      required: [from, to, reason]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: After from. }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CreatePurchaseRequest:
      type: object
      required: [supplier, reference, currency, lines]
      properties:
        supplier: { type: string, enum: [allegro_cz, allegro_pl, bikeinn, bike24, bike_discount, other], description: 'Supplier code, as on offers. Every line with an offer must come from it.' }
        seller: { type: [string, 'null'], maxLength: 120 }
        reference: { type: string, minLength: 1, maxLength: 120, description: "The supplier's order number; becomes the lines' supplierReference." }
        currency: { type: string, enum: [CZK, EUR, PLN] }
        fxRateCzk: { type: [integer, 'null'], minimum: 1, description: 'CZK per currency unit in millionths, as paid. Required for EUR and PLN; 1000000 or left out for CZK.' }
        fxRateDate: { type: [string, 'null'], format: date }
        inboundShippingMinor: { type: integer, minimum: 0, default: 0, description: 'Delivery to NODRA for the whole purchase, purchase currency.' }
        note: { type: [string, 'null'], maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/PurchaseLineRequest' }
    PurchaseLineRequest:
      type: object
      required: [itemId, unitPriceMinor]
      properties:
        itemId: { type: string, format: uuid, description: 'Order line id, any confirmed order; each line once. The whole line quantity is bought.' }
        unitPriceMinor: { type: integer, minimum: 0, description: 'Per unit, purchase currency; prefill it from the offer.' }
    AdminPurchase:
      type: object
      required: [id, supplier, seller, reference, currency, fxRateCzk, fxRateDate, inboundShippingMinor, status, orderedAt, receivedAt, cancelledAt, cancelReason, note, createdBy, goodsMinor, costCzkMinor, lines, actions]
      properties:
        id: { type: string, format: uuid }
        supplier: { type: string }
        seller: { type: [string, 'null'] }
        reference: { type: string }
        currency: { type: string, enum: [CZK, EUR, PLN] }
        fxRateCzk: { type: integer }
        fxRateDate: { type: [string, 'null'], format: date }
        inboundShippingMinor: { type: integer }
        status: { type: string, enum: [ordered, received, cancelled] }
        orderedAt: { type: string, format: date-time }
        receivedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        cancelReason: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        createdBy: { type: string, description: Admin email. }
        goodsMinor: { type: integer, description: 'Sum of unit price x quantity, purchase currency.' }
        costCzkMinor: { type: integer, description: 'Sum of actual unit cost x quantity, haléře (shipping included).' }
        lines:
          type: array
          items:
            type: object
            required: [id, itemId, orderId, orderReference, sku, name, variant, quantity, unitPriceMinor, allocatedShippingMinor, unitCostCzkMinor, snapshotUnitCostCzkMinor, procurementStatus, lineState]
            properties:
              id: { type: string, format: uuid }
              itemId: { type: string, format: uuid }
              orderId: { type: string, format: uuid }
              orderReference: { type: string }
              sku: { type: string }
              name: { type: string }
              variant: { type: string }
              quantity: { type: integer }
              unitPriceMinor: { type: integer }
              allocatedShippingMinor: { type: integer, description: "This line's share of the inbound shipping, purchase currency." }
              unitCostCzkMinor: { type: integer, description: Actual landed cost per unit. }
              snapshotUnitCostCzkMinor: { type: [integer, 'null'], description: 'The checkout snapshot, to compare.' }
              procurementStatus: { type: string, enum: [from_stock, to_order, ordered, received, failed], description: 'The order line now.' }
              lineState: { type: string, enum: [active, cancelled, returned] }
        actions:
          type: array
          description: 'receive and cancel while ordered; cancel is still refused once a line was received.'
          items: { type: string, enum: [receive, cancel] }
    AdminPurchasePage:
      type: object
      required: [items, page, pages, total]
      properties:
        page: { type: integer }
        pages: { type: integer }
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, supplier, seller, reference, currency, status, orderedAt, receivedAt, lineCount, goodsMinor, inboundShippingMinor, costCzkMinor]
            properties:
              id: { type: string, format: uuid }
              supplier: { type: string }
              seller: { type: [string, 'null'] }
              reference: { type: string }
              currency: { type: string, enum: [CZK, EUR, PLN] }
              status: { type: string, enum: [ordered, received, cancelled] }
              orderedAt: { type: string, format: date-time }
              receivedAt: { type: [string, 'null'], format: date-time }
              lineCount: { type: integer }
              goodsMinor: { type: integer }
              inboundShippingMinor: { type: integer }
              costCzkMinor: { type: integer }
    ToPurchase:
      type: object
      required: [groups, lineCount]
      properties:
        lineCount: { type: integer }
        groups:
          type: array
          items:
            type: object
            required: [supplier, lines]
            properties:
              supplier: { type: [string, 'null'], description: 'Null for the lines without an offer ("no source"), always the last group.' }
              lines: { type: array, items: { $ref: '#/components/schemas/ToPurchaseLine' } }
    ToPurchaseLine:
      type: object
      required: [itemId, orderId, orderReference, confirmedAt, variantId, name, variant, sku, quantity, unitPrice, snapshotUnitCostCzkMinor, leadTimeMaxDays, promisedDate, offer]
      properties:
        itemId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderReference: { type: string }
        confirmedAt: { type: [string, 'null'], format: date-time }
        variantId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        variant: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: '#/components/schemas/Price', description: 'Selling price per unit.' }
        snapshotUnitCostCzkMinor: { type: [integer, 'null'] }
        leadTimeMaxDays: { type: [integer, 'null'] }
        promisedDate: { type: [string, 'null'], format: date }
        offer: { oneOf: [{ $ref: '#/components/schemas/OfferSource' }, { type: 'null' }] }
    AccountSummary:
      type: object
      required: [name, email, points, historyPage, historyPages, historyTotal, history, lastDelivery]
      properties:
        name: { type: string }
        email: { type: string }
        points: { type: integer }
        historyPage: { type: integer }
        historyPages: { type: integer }
        historyTotal: { type: integer }
        history:
          type: array
          items:
            type: object
            required: [reference, points, reason, createdAt]
            properties:
              reference: { type: string }
              points: { type: integer, description: 'Negative for a refund; a correction (a voided payment or refund on a completed order) can go either way.' }
              reason: { type: string, enum: [earn, refund, correction] }
              createdAt: { type: string }
        lastDelivery:
          type: [object, 'null']
          required: [phone, contactChannel, address, city, postalCode, district]
          properties:
            phone: { type: [string, 'null'] }
            contactChannel: { type: [string, 'null'], enum: [whatsapp, telegram, phone, null] }
            address: { type: [string, 'null'] }
            city: { type: [string, 'null'] }
            postalCode: { type: [string, 'null'] }
            district: { type: [string, 'null'] }
    IdResponse:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    PricingRule:
      type: object
      required: [id, categoryId, categorySlug, minCostCzkMinor, maxCostCzkMinor, markupBp, active]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: [string, 'null'], format: uuid, description: Null for a default rule. }
        categorySlug: { type: [string, 'null'] }
        minCostCzkMinor: { type: integer, description: 'Landed cost band start in haléře, inclusive.' }
        maxCostCzkMinor: { type: [integer, 'null'], description: 'Band end in haléře, exclusive; null for no limit.' }
        markupBp: { type: integer, description: 'Markup on landed cost in basis points, 4000 = 40 %.' }
        active: { type: boolean }
    PricingRuleWriteRequest:
      type: object
      required: [minCostCzkMinor, markupBp]
      properties:
        categoryId: { type: [string, 'null'], format: uuid, description: Omit or null for a default rule. }
        minCostCzkMinor: { type: integer, minimum: 0 }
        maxCostCzkMinor: { type: [integer, 'null'], minimum: 1, description: Must be above minCostCzkMinor. }
        markupBp: { type: integer, minimum: 0, maximum: 100000 }
        active: { type: boolean, default: true }
    AdminAvailability:
      allOf:
        - $ref: '#/components/schemas/Availability'
        - type: object
          required: [reason]
          properties:
            reason:
              type: [string, 'null']
              enum: [no_offers, sold_out, not_matched, stale, missing_fx, unknown_lead_time, null]
              description: Why the variant is not orderable; null when it is.
    LandedCost:
      type: object
      description: The best fresh matched offer and how its landed cost is made.
      required: [offerId, supplier, seller, url, currency, priceMinor, inboundShippingMinor, fxRateCzk, fxRateDate, checkedAt, leadTimeMinDays, leadTimeMaxDays, landedCostCzk]
      properties:
        offerId: { type: string, format: uuid }
        supplier: { type: string }
        seller: { type: [string, 'null'] }
        url: { type: string }
        currency: { type: string }
        priceMinor: { type: integer }
        inboundShippingMinor: { type: integer }
        fxRateCzk: { type: integer }
        fxRateDate: { type: [string, 'null'], format: date }
        checkedAt: { type: string, format: date-time }
        leadTimeMinDays: { type: [integer, 'null'], description: "The supplier's own lead time, without handling." }
        leadTimeMaxDays: { type: [integer, 'null'] }
        landedCostCzk: { type: integer, description: 'round((priceMinor + inboundShippingMinor) * fxRateCzk / 1000000), haléře.' }
    PriceSuggestion:
      type: object
      required: [priceCzk, priceEur, markupPriceCzk, rrpCapCzk, rrpCapped, floorPriceCzk, marginBp, aboveMarket]
      properties:
        priceCzk: { type: integer, description: 'The suggested CZK price in haléře, a whole 10 Kč.' }
        priceEur: { type: integer, description: 'priceCzk at the EUR display rate, rounded to 0.10 €.' }
        markupPriceCzk: { type: integer, description: 'Landed cost plus the rule markup, rounded up to 10 Kč.' }
        rrpCapCzk: { type: [integer, 'null'], description: 'RRP times the RRP factor, rounded down to 10 Kč; null without RRP.' }
        rrpCapped: { type: boolean, description: The cap lowered the price. }
        floorPriceCzk: { type: integer, description: 'Landed cost plus the minimum margin, rounded up to 10 Kč.' }
        marginBp: { type: integer, description: (priceCzk - landed cost) / landed cost in basis points. }
        aboveMarket: { type: boolean, description: The suggested price is more than the threshold above the market price. }
    VariantPricing:
      type: object
      required: [variantId, productId, productName, sku, categoryId, categorySlug, priceCzk, priceEur, currentMarginBp, availability, cost, rule, suggestion, rrpMinor, rrpCurrency, rrpSource, rrpCheckedAt, rrpCzk, marketPriceMinor, marketPriceSource, marketCheckedAt, flags, applicable]
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string, description: English name. }
        sku: { type: string }
        categoryId: { type: string, format: uuid }
        categorySlug: { type: string }
        priceCzk: { type: integer, description: Current price. }
        priceEur: { type: integer }
        currentMarginBp: { type: [integer, 'null'], description: 'Margin of the current CZK price over landed cost; null without a cost.' }
        availability: { $ref: '#/components/schemas/AdminAvailability' }
        cost: { oneOf: [{ $ref: '#/components/schemas/LandedCost' }, { type: 'null' }] }
        rule: { oneOf: [{ $ref: '#/components/schemas/PricingRule' }, { type: 'null' }], description: 'Null without a cost or when no rule covers it.' }
        suggestion: { oneOf: [{ $ref: '#/components/schemas/PriceSuggestion' }, { type: 'null' }] }
        rrpMinor: { type: [integer, 'null'] }
        rrpCurrency: { type: [string, 'null'] }
        rrpSource: { type: [string, 'null'] }
        rrpCheckedAt: { type: [string, 'null'], format: date }
        rrpCzk: { type: [integer, 'null'], description: 'RRP in haléře, an EUR RRP converted at the EUR display rate.' }
        marketPriceMinor: { type: [integer, 'null'] }
        marketPriceSource: { type: [string, 'null'] }
        marketCheckedAt: { type: [string, 'null'], format: date }
        flags:
          type: array
          description: 'margin_too_low - the rule or RRP target cannot keep the minimum margin, the suggestion was lifted to the floor and is never applied automatically; above_market - the current price is more than the threshold above the market price (informs only).'
          items: { type: string, enum: [margin_too_low, above_market] }
        applicable: { type: boolean, description: There is a suggestion and it is not flagged margin_too_low. }
    PriceApplied:
      type: object
      required: [variantId, oldPriceCzk, newPriceCzk, oldPriceEur, newPriceEur, changed]
      properties:
        variantId: { type: string, format: uuid }
        oldPriceCzk: { type: integer }
        newPriceCzk: { type: integer }
        oldPriceEur: { type: integer }
        newPriceEur: { type: integer }
        changed: { type: boolean, description: 'False when the price already was the suggestion; no history is written then.' }
    PriceHistoryPage:
      type: object
      required: [items, page, pages, total]
      properties:
        page: { type: integer }
        pages: { type: integer }
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, oldPriceCzk, newPriceCzk, oldPriceEur, newPriceEur, reason, changedBy, changedAt]
            properties:
              id: { type: string, format: uuid }
              oldPriceCzk: { type: [integer, 'null'], description: Null for the first price of a new variant. }
              newPriceCzk: { type: integer }
              oldPriceEur: { type: [integer, 'null'] }
              newPriceEur: { type: integer }
              reason: { type: string, enum: [manual, reprice, import] }
              changedBy: { type: string, description: 'Admin email, or system for the import.' }
              changedAt: { type: string, format: date-time }
    RepricePreview:
      type: object
      required: [categoryId, variants, withoutSuggestion, rows]
      properties:
        categoryId: { type: [string, 'null'], format: uuid }
        variants: { type: integer, description: Active variants in scope. }
        withoutSuggestion: { type: integer, description: 'Of those, variants with no fresh matched offer or no rule.' }
        rows:
          type: array
          items:
            type: object
            required: [variantId, productId, productName, sku, categorySlug, priceCzk, priceEur, landedCostCzk, currentMarginBp, suggestedPriceCzk, suggestedPriceEur, suggestedMarginBp, marketPriceMinor, suggestionAboveMarket, flags, changed, applicable]
            properties:
              variantId: { type: string, format: uuid }
              productId: { type: string, format: uuid }
              productName: { type: string }
              sku: { type: string }
              categorySlug: { type: string }
              priceCzk: { type: integer }
              priceEur: { type: integer }
              landedCostCzk: { type: integer }
              currentMarginBp: { type: integer }
              suggestedPriceCzk: { type: integer, description: Send this back when applying. }
              suggestedPriceEur: { type: integer }
              suggestedMarginBp: { type: integer }
              marketPriceMinor: { type: [integer, 'null'] }
              suggestionAboveMarket: { type: boolean }
              flags: { type: array, items: { type: string, enum: [margin_too_low, above_market] } }
              changed: { type: boolean, description: The suggestion differs from the current CZK or EUR price. }
              applicable: { type: boolean }
    RepriceApplyRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [variantId, suggestedPriceCzk]
            properties:
              variantId: { type: string, format: uuid }
              suggestedPriceCzk: { type: integer, minimum: 0 }
    RepriceApplyResult:
      type: object
      required: [applied, items]
      properties:
        applied: { type: integer, description: Variants whose price actually changed. }
        items: { type: array, items: { $ref: '#/components/schemas/PriceApplied' } }
    PricingAlerts:
      type: object
      required: [marginTooLow, aboveMarket, checkNeeded]
      properties:
        marginTooLow: { type: integer }
        aboveMarket: { type: integer }
        checkNeeded: { type: integer }
    PricingThresholds:
      type: object
      required: [minMarginBp, aboveMarketBp]
      properties:
        minMarginBp: { type: integer, description: 'Minimum margin a suggestion must keep, basis points (1000 = 10 %).' }
        aboveMarketBp: { type: integer, description: 'A price this much above the market price is flagged above_market, basis points (1500 = 15 %).' }
    ImportCounts:
      type: object
      description: Complete numbers per report section; the lists themselves are truncated to 200 rows.
      required: [totalRows, newProducts, updates, conflicts, unknowns, errors, rowsWithCost, suggestionsMarginTooLow]
      properties:
        totalRows: { type: integer, description: 'Data rows read from the file, cap included.' }
        newProducts: { type: integer, description: Rows that would create a new draft product with a variant. }
        updates: { type: integer, description: 'Rows that would change at least one field of an existing variant or offer.' }
        conflicts: { type: integer }
        unknowns: { type: integer }
        errors: { type: integer }
        rowsWithCost: { type: integer, description: Touched variants the cost section lists. }
        suggestionsMarginTooLow: { type: integer, description: 'Cost rows whose suggested price would be flagged margin_too_low; flagged, never auto-applied.' }
    ImportNewProduct:
      type: object
      required: [row, productName, brand, category, priceMinor, currency]
      properties:
        row: { type: integer, description: 1-based data row number in the file. }
        productName: { type: string }
        brand: { type: string, nullable: true }
        ean: { type: string, nullable: true }
        mpn: { type: string, nullable: true }
        category: { type: string, description: Slug of the guessed category. }
        priceMinor: { type: integer }
        currency: { type: string }
    ImportUpdate:
      type: object
      required: [row, variantId, sku, productName, changes]
      properties:
        row: { type: integer }
        variantId: { type: string, format: uuid }
        sku: { type: string }
        productName: { type: string }
        changes:
          type: array
          minItems: 1
          items:
            type: object
            required: [field, old, new]
            properties:
              field: { type: string, enum: [offer, price, stock, leadTime, rrp, url, title] }
              old: { type: [string, integer, 'null'] }
              new: { type: [string, integer, 'null'] }
    ImportConflict:
      type: object
      required: [row, message]
      properties:
        row: { type: integer }
        message: { type: string }
        productName: { type: string, nullable: true }
        ean: { type: string, nullable: true }
    ImportUnknown:
      type: object
      required: [row, kind, message]
      properties:
        row: { type: integer }
        kind: { type: string, enum: [unknown_category, new_brand, unknown_attribute, delivery_time, no_identity, invalid_ean] }
        message: { type: string }
    ImportRowError:
      type: object
      required: [row, message]
      properties:
        row: { type: integer, description: '1-based data row number, 0 for a file-level problem.' }
        message: { type: string }
    ImportCostRow:
      type: object
      required: [productName, categorySlug, feedPriceMinor, currency, fxRateCzk, inboundShippingMinor, landedCostCzk, suggestedPriceCzk, marginTooLow]
      properties:
        variantId: { type: string, format: uuid, nullable: true, description: Null for a variant the import would create. }
        productName: { type: string }
        categorySlug: { type: string }
        feedPriceMinor: { type: integer }
        currency: { type: string }
        fxRateCzk: { type: integer, nullable: true, description: 'Millionths; null when the currency has no rate, then there is no cost and no suggestion.' }
        inboundShippingMinor: { type: integer, description: The supplier's import default. }
        landedCostCzk: { type: integer, nullable: true }
        suggestedPriceCzk: { type: integer, nullable: true, description: What the current pricing rules would suggest from the landed cost; null without a rule. }
        suggestedPriceEur: { type: integer, nullable: true }
        marginTooLow: { type: boolean }
    ImportCost:
      type: object
      required: [rows, marginTooLow]
      properties:
        rows:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ImportCostRow' }
        marginTooLow: { type: integer, description: 'Complete count of flagged rows, truncation included.' }
    ImportReport:
      type: object
      required: [runId, source, fileName, sha256, totalRows, counts, newProducts, updates, conflicts, unknowns, errors, cost]
      properties:
        runId: { type: string, format: uuid }
        source: { type: string, enum: [awin_csv] }
        fileName: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        totalRows: { type: integer }
        counts: { $ref: '#/components/schemas/ImportCounts' }
        newProducts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ImportNewProduct' } }
        updates: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ImportUpdate' } }
        conflicts: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ImportConflict' } }
        unknowns: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ImportUnknown' } }
        errors: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ImportRowError' } }
        cost: { $ref: '#/components/schemas/ImportCost' }
    ImportApplyResult:
      type: object
      required: [runId, written, report]
      properties:
        runId: { type: string, format: uuid }
        written:
          type: object
          required: [products, variants, offers, offerUpdates, rrpWrites]
          properties:
            products: { type: integer, description: Draft products created. }
            variants: { type: integer, description: Variants created. }
            offers: { type: integer, description: Offers created. }
            offerUpdates: { type: integer, description: Offers updated. }
            rrpWrites: { type: integer, description: Variant RRP values written from the feed. }
        report: { $ref: '#/components/schemas/ImportReport' }
    ImportRunSummary:
      type: object
      required: [id, source, fileName, status, totalRows, counts, startedAt, finishedAt, adminEmail, errorCount]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [awin_csv, seed] }
        fileName: { type: string, nullable: true }
        status: { type: string, enum: [previewed, applied] }
        totalRows: { type: integer }
        counts: { $ref: '#/components/schemas/ImportCounts' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        adminEmail: { type: string, nullable: true, description: Null for a console (seed) run. }
        errorCount: { type: integer }
    ImportRunPage:
      type: object
      required: [items, page, pages, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ImportRunSummary' } }
        page: { type: integer }
        pages: { type: integer }
        total: { type: integer }
    ImportRunDetail:
      type: object
      required: [id, source, fileName, status, totalRows, counts, startedAt, finishedAt, adminEmail, errorCount, errors, report]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [awin_csv, seed] }
        fileName: { type: string, nullable: true }
        status: { type: string, enum: [previewed, applied] }
        totalRows: { type: integer }
        counts: { $ref: '#/components/schemas/ImportCounts' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        adminEmail: { type: string, nullable: true }
        errorCount: { type: integer }
        errors: { type: array, items: { $ref: '#/components/schemas/ImportRowError' }, description: 'Every per-row error, truncation included.' }
        report: { $ref: '#/components/schemas/ImportReport' }
    ImportSetting:
      type: object
      required: [supplier, inboundShippingMinor]
      properties:
        supplier: { type: string }
        inboundShippingMinor: { type: integer, minimum: 0, description: In the supplier's feed currency. }
    ImportSettingsList:
      type: object
      required: [settings]
      properties:
        settings: { type: array, items: { $ref: '#/components/schemas/ImportSetting' } }
    ImportSettingWrite:
      type: object
      required: [inboundShippingMinor]
      properties:
        inboundShippingMinor: { type: integer, minimum: 0 }
