openapi: 3.1.0
info:
  title: NODRA Commerce API
  version: 0.2.0
  description: JSON contract for the NODRA cycling equipment demo storefront and administration.
servers:
  - url: http://localhost:8000
tags:
  - name: Catalogue
  - name: Checkout
  - name: Account
  - name: Administration
paths:
  /api/account/google/start:
    get:
      tags: [Account]
      summary: Start Google OpenID Connect sign-in
      description: Redirects to Google when OAuth credentials are configured. Uses the server session to verify state on return.
      parameters: [{ name: locale, in: query, schema: { type: string, enum: [cs, de, en] } }]
      responses:
        '302': { description: Redirect to Google or to the local account page when credentials are absent. }
  /api/account/google/callback:
    get:
      tags: [Account]
      summary: Complete Google sign-in
      description: Verifies OAuth state and Google verified email, then creates or resumes the account.
      responses:
        '302': { description: Redirect to the account page. }
  /api/account/demo-login:
    post:
      tags: [Account]
      summary: Sign in to a local demo account
      description: Available only in the development environment; first sign-in sends a welcome email to local Mailpit.
      responses:
        '200': { description: Demo account summary. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/account/me:
    get:
      tags: [Account]
      summary: Read signed-in account and earned points
      description: Returns the full point balance and up to 20 ledger entries for the requested history page.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Account profile, point balance, history page and history totals.' }
        '401': { description: Sign-in required. }
  /api/account/logout:
    post:
      tags: [Account]
      summary: Clear customer session
      responses:
        '200': { description: Session ended. }
  /api/products:
    get:
      tags: [Catalogue]
      summary: Browse published cycling products
      description: Returns public product cards in a stable order. Filters can be combined; the response contains only fields needed by the product list. A category filter includes products from its subcategories. Attribute filters match when at least one active variant has the value, a variant value taking precedence over the product value. Search matches the localized name, brand, slug, variant MPN and exact EAN. Successful responses may be cached by shared caches for 15 seconds; checkout always checks current stock and prices.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: category, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string, maxLength: 80 } }
        - name: attr
          in: query
          style: deepObject
          explode: true
          description: 'Attribute filters, for example attr[speeds]=11,12. Several comma-separated values mean any of them; several keys must all match.'
          schema: { type: object, additionalProperties: { type: string, maxLength: 200 } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: sort, in: query, schema: { type: string, enum: [featured, price_asc, price_desc, newest] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: availableOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Paginated published products.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pages, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductCard' } }
                  page: { type: integer }
                  pages: { type: integer }
                  total: { type: integer }
  /api/products/{slug}:
    get:
      tags: [Catalogue]
      summary: Read one published product
      description: Returns localized copy, product imagery, options, prices and live availability for one product.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Product details.
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/categories:
    get:
      tags: [Catalogue]
      summary: List catalogue categories
      description: Returns the active category tree with localized labels. Each count includes published products of its active subcategories.
      parameters: [{ $ref: '#/components/parameters/Locale' }]
      responses:
        '200':
          description: Root categories with nested children.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } }
  /api/categories/{slug}/facets:
    get:
      tags: [Catalogue]
      summary: List filter values for one category
      description: Returns brands and filterable attribute values found among published products of the category and its subcategories, with product counts. Counts ignore other active filters.
      parameters:
        - $ref: '#/components/parameters/Locale'
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Available filter values.
          content: { application/json: { schema: { $ref: '#/components/schemas/Facets' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/checkout:
    post:
      tags: [Checkout]
      summary: Place a demo order as a guest or signed-in customer
      description: Reprices items and checks stock in a transaction. Czech delivery address is required in every interface locale. Signed-in customers must use their account email to earn points on completion. Repeating the same idempotency key and payload returns the same order; a changed payload conflicts. No payment or shipment is performed.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 80 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutRequest' } } }
      responses:
        '201':
          description: Demo order placed and stock reserved.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderReceipt' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/orders/{reference}:
    get:
      tags: [Checkout]
      summary: Look up a demo order
      description: Requires the unguessable lookup token returned at checkout; never exposes customer information to a reference alone.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Customer-facing order receipt.
          content: { application/json: { schema: { $ref: '#/components/schemas/OrderReceipt' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/login:
    post:
      tags: [Administration]
      summary: Start an admin session
      description: Authenticates a seeded demo administrator and starts an HTTP-only session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Signed in. }
        '401': { description: Invalid credentials. }
  /api/admin/me:
    get:
      tags: [Administration]
      summary: Read the active admin session
      description: Returns the admin identity and CSRF token for authenticated requests.
      responses:
        '200': { description: Authenticated administrator. }
        '401': { description: No active session. }
  /api/admin/logout:
    post:
      tags: [Administration]
      summary: End the admin session
      responses:
        '302': { description: Session ended. }
  /api/admin/dashboard:
    get:
      tags: [Administration]
      summary: Read operational dashboard
      description: Returns order counts, recent orders, low-stock variants and demo revenue totals.
      responses:
        '200': { description: Admin dashboard data. }
        '401': { description: Authentication required. }
  /api/admin/products:
    get:
      tags: [Administration]
      summary: List products for editing
      description: Returns up to 24 products per page, including drafts, category, brand, attributes, variant identifiers, dated supplier offers and separate NODRA inventory data. Reported supplier quantity is not owned stock. Search also matches brand, variant MPN and EAN.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200': { description: 'Admin product page with items, page, pages and total.' }
        '401': { description: Authentication required. }
    post:
      tags: [Administration]
      summary: Create a product
      description: Creates a product with one zero-stock variant; the submitted status may be draft or published. Requires X-CSRF-Token from /api/admin/me.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductWriteRequest' } } }
      responses:
        '201': { description: Product created. }
        '401': { description: Authentication required. }
        '403': { description: Invalid CSRF token. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/products/{id}:
    put:
      tags: [Administration]
      summary: Update a product
      description: Changes localized copy, category, brand, attributes, status, image, merchandising order and the first variant's base prices. Long descriptions, details and gallery images are kept. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductWriteRequest' } } }
      responses:
        '200': { description: Product updated. }
        '401': { description: Authentication required. }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/stock-adjustments:
    post:
      tags: [Administration]
      summary: Adjust variant inventory
      description: Records a reasoned stock movement and updates availability atomically. Requires X-CSRF-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, delta, reason]
              properties:
                variantId: { type: string, format: uuid }
                delta: { type: integer, not: { const: 0 } }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201': { description: Stock movement recorded. }
        '401': { description: Authentication required. }
        '403': { description: Invalid CSRF token. }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/products/{id}/variants:
    post:
      tags: [Administration]
      summary: Add a variant with zero stock
      description: Requires an authenticated session and X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VariantWriteRequest' } } }
      responses:
        '201': { description: Variant created. }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/variants/{id}:
    put:
      tags: [Administration]
      summary: Update a variant
      description: Updates labels, identifiers, attributes, prices and active status. SKU is immutable. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VariantWriteRequest' } } }
      responses:
        '200': { description: Variant updated. }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/categories:
    get:
      tags: [Administration]
      summary: List all categories
      description: Returns every category, including inactive ones, as a flat list ordered for tree display. Attribute definitions are the category's own; the effective set also includes its ancestors' definitions.
      responses:
        '200':
          description: Categories.
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminCategory' } } } }
        '401': { description: Authentication required. }
    post:
      tags: [Administration]
      summary: Create a category
      description: Requires X-CSRF-Token. Attribute keys must be unique across the category and its ancestors.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWriteRequest' } } }
      responses:
        '201': { description: Category created. }
        '403': { description: Invalid CSRF token. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/categories/{id}:
    put:
      tags: [Administration]
      summary: Update a category
      description: Changes labels, parent, position, active state and own attribute definitions. A category cannot move under itself or a descendant, and it cannot be deactivated while its subtree holds published products. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryWriteRequest' } } }
      responses:
        '200': { description: Category updated. }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/products/{id}/supplier-offers:
    post:
      tags: [Administration]
      summary: Record a supplier offer
      description: Stores a dated supplier listing for the product. Status `matched` needs the exact variant; the variant must belong to the product. Supplier data never appears in public responses. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SupplierOfferWriteRequest' } } }
      responses:
        '201': { description: Offer recorded. }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/supplier-offers/{id}:
    put:
      tags: [Administration]
      summary: Update a supplier offer
      description: Updates the check result, lead time, variant match and status. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SupplierOfferWriteRequest' } } }
      responses:
        '200': { description: Offer updated. }
        '403': { description: Invalid CSRF token. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /api/admin/orders:
    get:
      tags: [Administration]
      summary: List orders for fulfillment
      description: Returns up to 30 demo orders per page, newest first.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: 'Admin order page with items, page, pages and total.' }
        '401': { description: Authentication required. }
  /api/admin/orders/{id}:
    get:
      tags: [Administration]
      summary: Read order details for fulfillment
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Order and customer delivery details. }
        '401': { description: Authentication required. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/orders/{id}/status:
    patch:
      tags: [Administration]
      summary: Advance an order
      description: Permits only valid order state transitions; cancellation restores reserved inventory once. Completing an account order earns one point per 100 Kč or 4 € of product subtotal. Requires X-CSRF-Token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [processing, shipped, completed, cancelled] }
      responses:
        '200': { description: Order status updated. }
        '401': { description: Authentication required. }
        '403': { description: Invalid CSRF token. }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    Locale:
      name: locale
      in: query
      schema: { type: string, enum: [cs, de, en], default: en }
  responses:
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Request conflicts with current stock or order state.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Validation:
      description: Request failed validation.
      content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Category:
      type: object
      required: [id, slug, name, count, children]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        count: { type: integer, description: Published products in this category and its active subcategories. }
        children: { type: array, items: { $ref: '#/components/schemas/Category' } }
    Facets:
      type: object
      required: [category, brands, attributes]
      properties:
        category: { type: string }
        brands:
          type: array
          items: { type: object, required: [value, count], properties: { value: { type: string }, count: { type: integer } } }
        attributes:
          type: array
          items:
            type: object
            required: [key, label, type, values]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, number, choice] }
              unit: { type: [string, 'null'] }
              values:
                type: array
                items: { type: object, required: [value, label, count], properties: { value: { type: string }, label: { type: string }, count: { type: integer } } }
    Spec:
      type: object
      required: [key, label, value]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string, description: 'Display value, localized for choice attributes.' }
        unit: { type: [string, 'null'] }
    Price:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Minor currency units. }
        currency: { type: string, enum: [CZK, EUR] }
    ProductCard:
      type: object
      required: [id, slug, name, brand, category, categoryName, image, fromPrice, inStock, availableUnits]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        brand: { type: [string, 'null'] }
        category: { type: string, description: Category slug. }
        categoryName: { type: string }
        image: { type: string }
        fromPrice: { $ref: '#/components/schemas/Price' }
        inStock: { type: boolean }
        availableUnits: { type: integer, minimum: 0 }
        badge: { type: string, nullable: true }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [description, details, images, breadcrumbs, specs, inBox, variants]
          properties:
            short: { type: string }
            description: { type: string }
            details: { type: array, items: { type: string } }
            images: { type: array, items: { type: string } }
            breadcrumbs:
              type: array
              description: Category path from the root to the product's category.
              items: { type: object, required: [slug, name], properties: { slug: { type: string }, name: { type: string } } }
            specs: { type: array, description: Product-level attribute values., items: { $ref: '#/components/schemas/Spec' } }
            inBox: { type: [string, 'null'], description: Localized package contents. }
            variants:
              type: array
              items:
                type: object
                required: [id, sku, label, price, stock, mpn, ean, specs]
                properties:
                  id: { type: string, format: uuid }
                  sku: { type: string }
                  label: { type: string }
                  price: { $ref: '#/components/schemas/Price' }
                  stock: { type: integer }
                  mpn: { type: [string, 'null'] }
                  ean: { type: [string, 'null'] }
                  specs: { type: array, description: Values set on this variant; they override product values with the same key., items: { $ref: '#/components/schemas/Spec' } }
    CheckoutRequest:
      type: object
      required: [locale, customer, items]
      properties:
        locale: { type: string, enum: [cs, de, en] }
        customer:
          type: object
          required: [name, email, country, address, postalCode, district]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            country: { type: string, enum: [CZ] }
            address: { type: string }
            postalCode: { type: string, pattern: '^\\d{3}\\s?\\d{2}$' }
            district: { type: string, maxLength: 120 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [variantId, quantity]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 10 }
    ProductWriteRequest:
      type: object
      required: [slug, category, nameCs, nameDe, nameEn, shortCs, shortDe, shortEn, image, status, priceCzk, priceEur]
      properties:
        slug: { type: string, maxLength: 120 }
        category: { type: string, description: Slug of an active category. }
        brand: { type: [string, 'null'], maxLength: 80 }
        attributes: { $ref: '#/components/schemas/AttributeValues' }
        inBoxCs: { type: [string, 'null'], maxLength: 500 }
        inBoxDe: { type: [string, 'null'], maxLength: 500 }
        inBoxEn: { type: [string, 'null'], maxLength: 500 }
        nameCs: { type: string }
        nameDe: { type: string }
        nameEn: { type: string }
        shortCs: { type: string }
        shortDe: { type: string }
        shortEn: { type: string }
        image: { type: string }
        status: { type: string, enum: [draft, published] }
        priceCzk: { type: integer, minimum: 0 }
        priceEur: { type: integer, minimum: 0 }
        badge: { type: [string, 'null'] }
        featuredRank: { type: integer }
    VariantWriteRequest:
      type: object
      required: [sku, labelCs, labelDe, labelEn, priceCzk, priceEur]
      properties:
        sku: { type: string, maxLength: 80 }
        labelCs: { type: string }
        labelDe: { type: string }
        labelEn: { type: string }
        priceCzk: { type: integer, minimum: 0 }
        priceEur: { type: integer, minimum: 0 }
        active: { type: boolean }
        color: { type: [string, 'null'] }
        size: { type: [string, 'null'] }
        mpn: { type: [string, 'null'], maxLength: 64, description: Manufacturer part number. }
        ean: { type: [string, 'null'], pattern: '^(\d{8}|\d{12,14})$', description: 'GTIN-8/12/13/14 with a valid check digit, unique across variants.' }
        attributes: { $ref: '#/components/schemas/AttributeValues' }
    AttributeValues:
      type: object
      description: Values keyed by attribute key from the category's effective definitions. Values are strings; number attributes hold a decimal string and choice attributes one option value. An empty value removes the key.
      additionalProperties: { type: string, maxLength: 80 }
    AttributeDefinition:
      type: object
      required: [key, type, labelCs, labelDe, labelEn, filterable]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        type: { type: string, enum: [text, number, choice] }
        unit: { type: [string, 'null'], maxLength: 12 }
        labelCs: { type: string }
        labelDe: { type: string }
        labelEn: { type: string }
        filterable: { type: boolean }
        options:
          type: array
          description: Required for choice attributes.
          items:
            type: object
            required: [value]
            properties:
              value: { type: string, maxLength: 80 }
              labelCs: { type: [string, 'null'] }
              labelDe: { type: [string, 'null'] }
              labelEn: { type: [string, 'null'] }
    AdminCategory:
      type: object
      required: [id, slug, parentId, names, position, active, attributes, effectiveAttributes, productCount]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        names: { type: object, properties: { cs: { type: string }, de: { type: string }, en: { type: string } } }
        position: { type: integer }
        active: { type: boolean }
        attributes: { type: array, items: { $ref: '#/components/schemas/AttributeDefinition' } }
        effectiveAttributes: { type: array, items: { $ref: '#/components/schemas/AttributeDefinition' } }
        productCount: { type: integer, description: 'Products directly in this category, any status.' }
    CategoryWriteRequest:
      type: object
      required: [slug, nameCs, nameDe, nameEn]
      properties:
