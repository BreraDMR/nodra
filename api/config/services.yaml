# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # D02 pricing and availability settings, the one place to tune them (read by App\Pricing\PricingSettings).
    # The values are defaults picked while the owner was away, see D00.5/D00.6. Percentages are basis points, 100 = 1 %.
    app.pricing.fresh_offer_days: 7       # an offer checked longer ago than this needs a new check
    app.pricing.handling_days: 1          # added to the supplier's lead time
    app.pricing.rrp_factor_bp: 9700       # suggested price at most RRP x 0.97
    app.pricing.min_margin_bp: 1000       # ...but never below landed cost x 1.10
    app.pricing.eur_display_rate: '25.0'  # CZK per 1 EUR for EUR prices, until D06.7
    app.pricing.above_market_bp: 1500     # flag a price more than 15 % above the market price

    # D04 delivery, payment and legal settings (read by App\Delivery\DeliverySettings and App\Order\PaymentSettings).
    # Amounts are haléře. A null fee switches its method off: it's never offered and a request for it is refused.
    app.delivery.prague_fee_minor: 14900          # personal delivery in Prague, per shipment, below the threshold
    app.delivery.prague_free_from_minor: 50000    # goods subtotal from which every Prague shipment is free
    app.delivery.carrier_fee_minor: null          # carrier delivery outside Prague, off until the owner sets a tariff (D00.2)
    app.delivery.carrier_cod_fee_minor: null      # cash on delivery via the carrier, off with it
    app.delivery.pickup_note:                     # per language, default until D00.3
        cs: 'Místo a čas předání na Andělu domluvíme zprávou.'
        de: 'Ort und Zeit der Übergabe am Anděl vereinbaren wir per Nachricht.'
        en: 'We agree the place and time at Anděl by message.'
    app.payment.handover_methods: [cash, bank_transfer]                   # card only once there is a terminal

    # P02 portfolio demo: the web demo rider account ("Vyzkoušet demo účet") stays closed outside dev
    # unless the deployment turns it on here — a real shop never does.
    app.account.demo_login: '%env(bool:APP_DEMO_LOGIN)%'
    app.legal.privacy_version: 'draft-2026-09'    # stored with every privacy consent, default until the D00.7 texts exist

    # D08 evening installations (read by App\Installation\InstallationSettings). Values marked default were chosen
    # without the owner; the works list ships empty until D00.4, so no code, no price and no customer purchase exists.
    app.installation.evening_start: 17     # Prague hour an installation may start at
    app.installation.evening_end: 21       # Prague hour it must end by (default, D00.4)
    app.installation.max_per_evening: 2    # bookings that may stay open on one evening (default)
    app.installation.travel_minutes: 30    # gap two open windows must keep for the road between addresses (default)
    app.installation.works: []             # [{code, name, priceMinor|null}]; the owner fills it (D00.4)

    # D09.3 hardening without a host: where the API error journal lives (one JSON line per error response)
    app.api_error_log: '%kernel.logs_dir%/api-errors.jsonl'

    # P02: the fixtures create the admin with this password. Empty means: the well-known dev
    # password in dev, a random one anywhere else (a demo deployment sets its own).
    app.admin.password: '%env(string:APP_ADMIN_PASSWORD)%'

    # D03.2 import: the supplier behind the uploaded Awin feed; more feeds join in D03.4
    app.import.awin_supplier: 'bike_components'
    # D03.4 feed refresh: defaults picked while the owner was away, see docs/design/d03-import.md
    app.import.batch_rows: 500              # planned rows written per background batch
    app.import.min_feed_interval: 60        # minutes between refreshes of one supplier's feed
    app.import.batch_attempts: 3            # automatic attempts per batch, past them only a manual restart
    app.import.stale_batch_minutes: 30      # a batch running longer than this is treated as interrupted
    app.import.download_timeout: 30         # seconds before the feed download gives up
    app.import.download_max_bytes: 50000000 # 50 MB cap on a downloaded feed

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # the throttling limiters of D09.3, defined in framework.yaml
            Symfony\Component\RateLimiter\RateLimiterFactory $apiPublicLimiter: '@limiter.api_public'
            Symfony\Component\RateLimiter\RateLimiterFactory $apiCheckoutLimiter: '@limiter.api_checkout'
            Symfony\Component\RateLimiter\RateLimiterFactory $apiAuthLimiter: '@limiter.api_auth'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Api\ApiErrorLogSubscriber:
        arguments:
            $logFile: '%app.api_error_log%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
