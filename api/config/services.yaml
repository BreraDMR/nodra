# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # D02 pricing and availability settings, the one place to tune them (read by App\Pricing\PricingSettings).
    # The values are defaults picked while the owner was away, see D00.5/D00.6. Percentages are basis points, 100 = 1 %.
    app.pricing.fresh_offer_days: 7       # an offer checked longer ago than this needs a new check
    app.pricing.handling_days: 1          # added to the supplier's lead time
    app.pricing.rrp_factor_bp: 9700       # suggested price at most RRP x 0.97
    app.pricing.min_margin_bp: 1000       # ...but never below landed cost x 1.10
    app.pricing.eur_display_rate: '25.0'  # CZK per 1 EUR for EUR prices, until D06.7
    app.pricing.above_market_bp: 1500     # flag a price more than 15 % above the market price

    # D04 delivery, payment and legal settings (read by App\Delivery\DeliverySettings and App\Order\PaymentSettings).
    # Amounts are haléře. A null fee switches its method off: it's never offered and a request for it is refused.
    app.delivery.prague_fee_minor: 14900          # personal delivery in Prague, per shipment, below the threshold
    app.delivery.prague_free_from_minor: 50000    # goods subtotal from which every Prague shipment is free
    app.delivery.carrier_fee_minor: null          # carrier delivery outside Prague, off until the owner sets a tariff (D00.2)
    app.delivery.carrier_cod_fee_minor: null      # cash on delivery via the carrier, off with it
    app.delivery.pickup_note:                     # per language, default until D00.3
        cs: 'Místo a čas předání na Andělu domluvíme zprávou.'
        de: 'Ort und Zeit der Übergabe am Anděl vereinbaren wir per Nachricht.'
        en: 'We agree the place and time at Anděl by message.'
    app.payment.handover_methods: [cash, bank_transfer]                   # card only once there is a terminal
    app.legal.privacy_version: 'draft-2026-09'    # stored with every privacy consent, default until the D00.7 texts exist

    # D03.2 import: the supplier behind the uploaded Awin feed; more feeds join in D03.4
    app.import.awin_supplier: 'bike_components'
    # D03.4 feed refresh: defaults picked while the owner was away, see docs/design/d03-import.md
    app.import.batch_rows: 500              # planned rows written per background batch
    app.import.min_feed_interval: 60        # minutes between refreshes of one supplier's feed
    app.import.batch_attempts: 3            # automatic attempts per batch, past them only a manual restart
    app.import.stale_batch_minutes: 30      # a batch running longer than this is treated as interrupted
    app.import.download_timeout: 30         # seconds before the feed download gives up
    app.import.download_max_bytes: 50000000 # 50 MB cap on a downloaded feed

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
